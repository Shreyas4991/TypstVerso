eight": 841.88976378, "regions": [{"page": 1, "x": 101.22368356299214, "y": 229.82520472440945, "kind": "lean-hover", "role": "token", "tooltip": "Demo.hello : String\n\nA small definition to quote from Typst. ", "width": 26.490234375000007, "height": 6.685937500000001}, {"page": 1, "x": 143.60805856299217, "y": 229.82520472440945, "kind": "lean-hover", "role": "token", "tooltip": "String : Type\n\nA string is a sequence of Unicode scalar values.\n\nAt runtime, strings are represented by [dynamic arrays](https://en.wikipedia.org/wiki/Dynamic_array)\nof bytes using the UTF-8 encoding. Both the size in bytes (`String.utf8ByteSize`) and in characters\n(`String.length`) are cached and take constant time. Many operations on strings perform in-place\nmodifications when the reference to the string is unique.\n", "width": 31.78828125000001, "height": 6.685937500000001}, {"page": 1, "x": 122.41587106299215, "y": 333.5951422244094, "kind": "lean-hover", "role": "token", "tooltip": "Demo.identity_pair (p q : Prop) : (p → p) ∧ (q → q)\n\nA multiline proof with two branches and interactive proof states. ", "width": 68.87460937500002, "height": 6.685937500000001}, {"page": 1, "x": 196.58852731299217, "y": 333.5951422244094, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 201.88657418799218, "y": 333.5951422244094, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 212.48266793799218, "y": 333.5951422244094, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 223.07876168799217, "y": 333.5951422244094, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 233.67485543799214, "y": 333.5951422244094, "kind": "lean-hover", "role": "token", "tooltip": "The universe of propositions. `Prop ≡ Sort 0`.\n\nEvery proposition is propositionally equal to either `True` or `False`. ", "width": 21.192187500000003, "height": 6.685937500000001}, {"page": 1, "x": 254.86704293799215, "y": 333.5951422244094, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 106.52173043799213, "y": 345.7810797244094, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 127.71391793799214, "y": 345.7810797244094, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 133.01196481299215, "y": 345.7810797244094, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 143.60805856299217, "y": 345.7810797244094, "kind": "lean-hover", "role": "token", "tooltip": "`And a b`, or `a ∧ b`, is the conjunction of propositions. It can be\nconstructed and destructed like a pair: if `ha : a` and `hb : b` then\n`⟨ha, hb⟩ : a ∧ b`, and if `h : a ∧ b` then `h.left : a` and `h.right : b`.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `∧` in identifiers is `and`.", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 159.50219918799215, "y": 345.7810797244094, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 180.69438668799216, "y": 345.7810797244094, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 185.99243356299218, "y": 345.7810797244094, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 212.48266793799218, "y": 345.7810797244094, "kind": "lean-hover", "role": "token", "tooltip": "`by tac` constructs a term of the expected type by running the tactic(s) `tac`. ", "width": 10.596093750000001, "height": 6.685937500000001}, {"page": 1, "x": 225.2787616879922, "y": 347.8470172244094, "kind": "lean-hover", "role": "state", "tooltip": "p : Prop\nq : Prop\n⊢ (p → p) ∧ (q → q)", "width": 8.25, "height": 4.62}, {"page": 1, "x": 90.62758981299213, "y": 357.9670172244094, "kind": "lean-hover", "role": "token", "tooltip": "If the main goal's target type is an inductive type, `constructor` solves it with\nthe first matching constructor, or else fails.\n\nIf more than one constructor matches, `constructor` still uses the first one, but it issues a\nwarning. Use `constructor!`, which is short for `constructor +first`, to select the first matching\nconstructor without a warning. To choose a specific constructor of a two-constructor inductive type,\nuse `left` or `right`.\n", "width": 58.278515625000026, "height": 6.685937500000001}, {"page": 1, "x": 151.10610543799217, "y": 360.0329547244094, "kind": "lean-hover", "role": "state", "tooltip": "case left\np : Prop\nq : Prop\n⊢ p → p\n\ncase right\np : Prop\nq : Prop\n⊢ q → q", "width": 8.25, "height": 4.62}, {"page": 1, "x": 90.62758981299213, "y": 370.15295472440937, "kind": "lean-hover", "role": "token", "tooltip": "`all_goals tac` runs `tac` on each goal, concatenating the resulting goals.\nIf the tactic fails on any goal, the entire `all_goals` tactic fails.\n\nSee also `any_goals tac`.\n", "width": 47.68242187500002, "height": 6.685937500000001}, {"page": 1, "x": 140.51001168799212, "y": 372.2188922244094, "kind": "lean-hover", "role": "state", "tooltip": "case left\np : Prop\nq : Prop\n⊢ p → p\n\ncase right\np : Prop\nq : Prop\n⊢ q → q", "width": 8.25, "height": 4.62}, {"page": 1, "x": 101.22368356299214, "y": 382.33889222440945, "kind": "lean-hover", "role": "token", "tooltip": "Introduces one or more hypotheses, optionally naming and/or pattern-matching them.\nFor each hypothesis to be introduced, the remaining main goal's target type must\nbe a `let` or function type.\n\n* `intro` by itself introduces one anonymous hypothesis, which can be accessed\n  by e.g. `assumption`. It is equivalent to `intro _`.\n* `intro x y` introduces two hypotheses and names them. Individual hypotheses\n  can be anonymized via `_`, given a type ascription, or matched against a pattern:\n  ```lean\n  -- ... ⊢ α × β → ...\n  intro (a, b)\n  -- ..., a : α, b : β ⊢ ...\n  ```\n* `intro rfl` is short for `intro h; subst h`, if `h` is an equality where the left-hand or right-hand side\n  is a variable.\n* Alternatively, `intro` can be combined with pattern matching much like `fun`:\n  ```lean\n  intro\n  | n + 1, 0 => tac\n  | ...\n  ```\n", "width": 26.490234375000007, "height": 6.685937500000001}, {"page": 1, "x": 133.01196481299212, "y": 382.33889222440945, "kind": "lean-hover", "role": "token", "tooltip": "p", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 140.51001168799212, "y": 384.4048297244094, "kind": "lean-hover", "role": "state", "tooltip": "case left\np : Prop\nq : Prop\nh : p\n⊢ p\n\ncase right\np : Prop\nq : Prop\nh : q\n⊢ q", "width": 8.25, "height": 4.62}, {"page": 1, "x": 101.22368356299214, "y": 394.5248297244094, "kind": "lean-hover", "role": "token", "tooltip": "`exact e` closes the main goal if its target type matches that of `e`.\n", "width": 26.490234375000007, "height": 6.685937500000001}, {"page": 1, "x": 133.01196481299212, "y": 394.5248297244094, "kind": "lean-hover", "role": "token", "tooltip": "p", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 140.51001168799212, "y": 396.5907672244094, "kind": "lean-hover", "role": "state", "tooltip": "No goals", "width": 8.25, "height": 4.62}, {"page": 1, "x": 78.03149606299213, "y": 528.6437047244095, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 99.22368356299214, "y": 528.6437047244095, "kind": "lean-hover", "role": "token", "tooltip": "The universe of propositions. `Prop ≡ Sort 0`.\n\nEvery proposition is propositionally equal to either `True` or `False`. ", "width": 21.192187500000003, "height": 6.685937500000001}, {"page": 1, "x": 78.03149606299213, "y": 540.8296422244096, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 5.298046875000001, "height": 6.685937500000001}, {"page": 1, "x": 99.22368356299214, "y": 540.8296422244096, "kind": "lean-hover", "role": "token", "tooltip": "The universe of propositions. `Prop ≡ Sort 0`.\n\nEvery proposition   <script>"use strict";
const leanTooltips = (() => {
  const tooltip = document.getElementById("tooltip");
  let pinned = false, active = null, activeRegion = null, hoveringTooltip = false, hideTimer = null;
  function cancelHide() {
    clearTimeout(hideTimer);
    hideTimer = null;
  }
  function hideSoon() {
    if (pinned) return;
    cancelHide();
    hideTimer = setTimeout(() => {
      if (!pinned && !hoveringTooltip && !tooltip.matches(":focus-within")) close();
    }, 200);
  }
  function close() {
    cancelHide();
    pinned = false;
    hoveringTooltip = false;
    tooltip.hidden = true;
    if (active) {
      active.classList.remove("active");
      active.removeAttribute("aria-describedby");
    }
    active = null;
    activeRegion = null;
  }
  function show(button, region) {
    if (pinned) return;
    if (active === button) cancelHide();
    else close();
    active = button;
    activeRegion = region;
    button.classList.add("active");
    button.setAttribute("aria-describedby", "tooltip");
    tooltip.textContent = region.tooltip;
    tooltip.dataset.pinned = "false";
    tooltip.style.maxHeight = "";
    tooltip.style.left = "12px";
    tooltip.style.top = "12px";
    tooltip.hidden = false;
    const rect = button.getBoundingClientRect();
    const width = tooltip.offsetWidth, height = tooltip.offsetHeight;
    tooltip.style.left = Math.max(12, Math.min(rect.left, innerWidth - width - 12)) + "px";
    const below = rect.bottom + 10;
    const belowSpace = innerHeight - below - 12;
    const aboveSpace = rect.top - 22;
    const useBelow = belowSpace >= Math.min(height, 80) || belowSpace >= aboveSpace;
    const available = Math.max(0, useBelow ? belowSpace : aboveSpace);
    const fittedHeight = Math.min(height, available);
    tooltip.style.maxHeight = fittedHeight + "px";
    // Read the final height after limiting it, including padding and borders.
    // Clamping an above-text popup to the viewport top can cover its trigger.
    tooltip.style.top = (useBelow ? below : rect.top - tooltip.offsetHeight - 10) + "px";
  }
  function mount(container, page) {
    container.innerHTML = page.svg;
    for (const region of page.regions) {
      const button = document.createElement("button");
      button.className = "hover";
      button.dataset.role = region.role;
      button.setAttribute("aria-label", region.role === "state" ? "Proof state: " + region.tooltip : region.tooltip);
      button.style.left = (100 * region.x / page.width) + "%";
      button.style.top = (100 * region.y / page.height) + "%";
      button.style.width = (100 * region.width / page.width) + "%";
      button.style.height = (100 * region.height / page.height) + "%";
      button.addEventListener("pointerenter", () => show(button, region));
      button.addEventListener("pointerleave", hideSoon);
      button.addEventListener("focus", () => show(button, region));
      button.addEventListener("blur", hideSoon);
      button.addEventListener("click", event => {
        event.stopPropagation();
        if (pinned && active === button) { close(); return; }
        close();
        show(button, region);
        pinned = true;
        tooltip.dataset.pinned = "true";
      });
      container.append(button);
    }
  }
  tooltip.tabIndex = 0;
  tooltip.addEventListener("pointerenter", () => { hoveringTooltip = true; cancelHide(); });
  tooltip.addEventListener("pointerleave", () => { hoveringTooltip = false; hideSoon(); });
  tooltip.addEventListener("focus", cancelHide);
  tooltip.addEventListener("blur", hideSoon);
  tooltip.addEventListener("wheel", event => {
    if (event.ctrlKey || !event.deltaY || tooltip.scrollHeight <= tooltip.clientHeight) return;
    // Keep docstring scrolling inside the popup, even in a scrolling reader.
    const unit = event.deltaMode === 1 ? parseFloat(getComputedStyle(tooltip).lineHeight)
      : event.deltaMode === 2 ? tooltip.clientHeight : 1;

    cancelHide();
    tooltip.scrollTop += event.deltaY * unit;

  addEventListener("keydown", event => { if (event.key === "Escape") close(); });
  addEventListener("click", event => { if (!tooltip.contains(event.target)) close(); });
  addEventListener("resize", close);
  addEventListener("scroll", () => {
    if (pinned || hoveringTooltip || tooltip.matches(":focus-within")) return;
    if (active && active.matches(":hover")) show(active, activeRegion);
    else close();
  }, {passive: true});
  return {close, mount};
})();
</script>
  <script>"use strict";
const pages = JSON.parse(document.getElementById("document-data").textContent);
const container = document.getElementById("pages");
const contents = document.getElementById("table-of-contents");
const headings = [];
for (const [index, page] of pages.entries()) {
  const section = document.createElement("section");
  section.className = "page";
  section.id = "page-" + (index + 1);
  section.setAttribute("aria-label", "Page " + (index + 1));
  section.style.aspectRatio = String(page.width / page.height);
  leanTooltips.mount(section, page);
  container.append(section);
  for (const heading of page.headings || []) {
    const anchor = document.createElement("span");
    anchor.id = heading.id;
    anchor.className = "heading-anchor";
    anchor.style.position = "absolute";
    anchor.style.top = (100 * heading.y / page.height) + "%";
    anchor.style.left = "0";
    anchor.style.scrollMarginTop = "24px";
    anchor.setAttribute("aria-hidden", "true");
    section.append(anchor);
    headings.push(heading);
  }
}
if (contents) {
  const parents = [];
  for (const heading of headings) {
    while (parents.length && parents[parents.length - 1].level >= heading.level) parents.pop();
    let list = contents;
    if (parents.length) {
      const parent = parents[parents.length - 1].item;
      list = parent.querySelector(":scope > ol");
      if (!list) { list = document.createElement("ol"); parent.append(list); }
    }
    const item = document.createElement("li");
    const link = document.createElement("a");
    link.href = "#" + heading.id;
    link.textContent = heading.title;
    item.append(link);
    list.append(item);
    parents.push({level: heading.level, item});
  }
  contents.closest("nav").hidden = !headings.length;
}
document.getElementById("page-count").textContent = pages.length + (pages.length === 1 ? " page" : " pages");
// Pages are created dynamically, so resolve a saved fragment after mounting them.
const target = document.getElementById(location.hash.slice(1));
if (target) target.scrollIntoView();
</script>
