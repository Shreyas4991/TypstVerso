at zero.\n\nThis type is special-cased by both the kernel and the compiler, and overridden with an efficient\nimplementation. Both use a fast arbitrary-precision arithmetic library (usually\n[GMP](https://gmplib.org/)); at runtime, `Nat` values that are sufficiently small are unboxed.\n", "width": 14.44921875, "height": 6.078125}, {"page": 1, "x": 197.8829970472441, "y": 267.7829133858267, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 226.7814345472441, "y": 267.7829133858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 241.2306532972441, "y": 267.7829133858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 250.8634657972441, "y": 267.7829133858267, "kind": "lean-hover", "role": "token", "tooltip": "The less-equal relation: `x ≤ y` \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `≤` in identifiers is `le`.", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 260.4962782972441, "y": 267.7829133858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 270.1290907972441, "y": 267.7829133858267, "kind": "lean-hover", "role": "token", "tooltip": "`And a b`, or `a ∧ b`, is the conjunction of propositions. It can be\nconstructed and destructed like a pair: if `ha : a` and `hb : b` then\n`⟨ha, hb⟩ : a ∧ b`, and if `h : a ∧ b` then `h.left : a` and `h.right : b`.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `∧` in identifiers is `and`.", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 279.7619032972441, "y": 267.7829133858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.Prime (p : ℕ) : Prop\n\n`Nat.Prime p` means that `p` is a prime number, that is, a natural number\nat least 2 whose only divisors are `p` and `1`.\nThe theorem `Nat.prime_def` witnesses this description of a prime number. ", "width": 43.34765625, "height": 6.078125}, {"page": 1, "x": 327.9259657972441, "y": 267.7829133858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 352.0079970472441, "y": 267.7829133858267, "kind": "lean-hover", "role": "token", "tooltip": "`by tac` constructs a term of the expected type by running the tactic(s) `tac`. ", "width": 9.6328125, "height": 6.078125}, {"page": 1, "x": 363.6408095472441, "y": 269.6610383858267, "kind": "lean-hover", "role": "state", "tooltip": "n : ℕ\n⊢ ∃ p, n ≤ p ∧ Nat.Prime p", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 72.65643454724409, "y": 278.8610383858267, "kind": "lean-hover", "role": "token", "tooltip": "The `let` tactic is for adding definitions to the local context of the main goal.\nThe definition can be unfolded, unlike definitions introduced by `have`.\n\n* `let x : t := e` adds the definition `x : t := e` if `e` is a term of type `t`.\n* `let x := e` uses the type of `e` for `t`.\n* `let : t := e` and `let := e` use `this` for the name of the hypothesis.\n* `let pat := e` for a pattern `pat` is equivalent to `match e with | pat => _`,\n  where `_` stands for the tactics that follow this one.\n  It is convenient for types that let only one applicable constructor.\n  For example, given `p : α × β × γ`, `let ⟨x, y, z⟩ := p` produces the\n  local variables `x : α`, `y : β`, and `z : γ`.\n* The syntax `let (eq := h) pat := e` is equivalent to `match h : e with | pat => _`,\n  which adds the equation `h : e = pat` to the local context.\n\nThe tactic supports all the same syntax variants and options as the `let` term.\n\n## Properties and relations\n\n* Unlike `have`, it is possible to unfold definitions introduced using `let`, using tactics\n  such as `simp`, `dsimp`, `unfold`, and `subst`.\n* The `clear_value` tactic turns a `let` definition into a `have` definition after the fact.\n  The tactic might fail if the local context depends on the value of the variable.\n* The `let` tactic is preferred for data (non-propositions).\n* Sometimes `have` is used for non-propositions to ensure that the variable is never unfolded,\n  which may be important for performance reasons.\n", "width": 14.44921875, "height": 6.078125}, {"page": 1, "x": 91.92205954724409, "y": 278.8610383858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 120.82049704724409, "y": 278.8610383858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 130.4533095472441, "y": 278.8610383858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.factorial : ℕ → ℕ\n\n`Nat.factorial n` is the factorial of `n`. ", "width": 43.34765625, "height": 6.078125}, {"page": 1, "x": 178.6173720472441, "y": 278.8610383858267, "kind": "lean-hover", "role": "token", "tooltip": "`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 188.2501845472441, "y": 278.8610383858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 193.0665907972441, "y": 278.8610383858267, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 202.6994032972441, "y": 278.8610383858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.minFac (n : ℕ) : ℕ\n\nReturns the smallest prime factor of `n ≠ 1`. ", "width": 28.8984375, "height": 6.078125}, {"page": 1, "x": 233.5978407972441, "y": 280.7391633858267, "kind": "lean-hover", "role": "state", "tooltip": "n : ℕ\np : ℕ := (n.factorial + 1).minFac\n⊢ ∃ p, n ≤ p ∧ Nat.Prime p", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 72.65643454724409, "y": 289.9391633858267, "kind": "lean-hover", "role": "token", "tooltip": "The `have` tactic is for adding opaque definitions and hypotheses to the local context of the main goal.\nThe definitions forget their associated value and cannot be unfolded, unlike definitions added by the `let` tactic.\n\n* `have h : t := e` adds the hypothesis `h : t` if `e` is a term of type `t`.\n* `have h := e` uses the type of `e` for `t`.\n* `have : t := e` and `have := e` use `this` for the name of the hypothesis.\n* `have pat := e` for a pattern `pat` is equivalent to `match e with | pat => _`,\n  where `_` stands for the tactics that follow this one.\n  It is convenient for types that have only one applicable constructor.\n  For example, given `h : p ∧ q ∧ r`, `have ⟨h₁, h₂, h₃⟩ := h` produces the\n  hypotheses `h₁ : p`, `h₂ : q`, and `h₃ : r`.\n* The syntax `have (eq := h) pat := e` is equivalent to `match h : e with | pat => _`,\n  which adds the equation `h : e = pat` to the local context.\n\nThe tactic supports all the same syntax variants and options as the `have` term.\n\n## Properties and relations\n\n* It is not possible to unfold a variable introduced using `have`, since the definition's value is forgotten.\n  The `let` tactic introduces definitions that can be unfolded.\n* The `have h : t := e` is like doing `let h : t := e; clear_value h`.\n* The `have` tactic is preferred for propositions, and `let` is preferred for non-propositions.\n* Sometimes `have` is used for non-propositions to ensure that the variable is never unfolded,\n  which may be important for performance reasons.\n    Consider using the equivalent `let +nondep` to indicate the intent.\n\n", "width": 19.265625, "height": 6.078125}, {"page": 1, "x": 96.73846579724409, "y": 289.9391633858267, "kind": "lean-hover", "role": "token", "tooltip": "n.factorial + 1 ≠ 1", "width": 14.44921875, "height": 6.078125}, {"page": 1, "x": 125.63690329724409, "y": 289.9391633858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 135.2697157972441, "y": 289.9391633858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.factorial : ℕ → ℕ\n\n`Nat.factorial n` is the factorial of `n`. ", "width": 43.34765625, "height": 6.078125}, {"page": 1, "x": 183.4337782972441, "y": 289.9391633858267, "kind": "lean-hover", "role": "token", "tooltip": "`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 193.0665907972441, "y": 289.9391633858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 202.6994032972441, "y": 289.9391633858267, "kind": "lean-hover", "role": "token", "tooltip": "`a ≠ b`, or `Ne a b` is defined as `¬ (a = b)` or `a = b → False`,\nand asserts that `a` and `b` are not equal.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `≠` in identifiers is `ne`.", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 212.3322157972441, "y": 289.9391633858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078 n* `have h : t := e` adds the hypothesis `h : t` if `e` is a term of type `t`.\n* `have h := e` uses the type of `e` for `t`.\n* `have : t := e` and `have := e` use `this` for the name of the hypothesis.\n* `have pat := e` for a pattern `pat` is equivalent to `match e with | pat => _`,\n  where `_` stands for the tactics that follow this one.\n  It is convenient for types that have only one applicable constructor.\n  For example, given `h : p ∧ q ∧ r`, `have ⟨h₁, h₂, h₃⟩ := h` produces the\n  hypotheses `h₁ : p`, `h₂ : q`, and `h₃ : r`.\n* The syntax `have (eq := h) pat := e` is equivalent to `match h : e with | pat => _`,\n  which adds the equation `h : e = pat` to the local context.\n\nThe tactic supports all the same syntax variants and options as the `have` term.\n\n## Properties and relations\n\n* It is not possible to unfold a variable introduced using `have`, since the definition's value is forgotten.\n  The `let` tactic introduces definitions that can be unfolded.\n* The `have h : t := e` is like doing `let h : t := e; clear_value h`.\n* The `have` tactic is preferred for propositions, and `let` is preferred for non-propositions.\n* Sometimes `have` is used for non-propositions to ensure that the variable is never unfolded,\n  which may be important for performance reasons.\n    Consider using the equivalent `let +nondep` to indicate the intent.\n\n", "width": 19.265625, "height": 6.078125}, {"page": 1, "x": 96.73846579724409, "y": 323.1735383858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.Prime p", "width": 9.6328125, "height": 6.078125}, {"page": 1, "x": 120.82049704724409, "y": 323.1735383858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.Prime (p : ℕ) : Prop\n\n`Nat.Prime p` means that `p` is a prime number, that is, a natural number\nat least 2 whose only divisors are `p` and `1`.\nThe theorem `Nat.prime_def` witnesses this description of a prime number. ", "width": 43.34765625, "height": 6.078125}, {"page": 1, "x": 168.9845595472441, "y": 323.1735383858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 193.0665907972441, "y": 323.1735383858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.minFac_prime {n : ℕ} (n1 : n ≠ 1) : Nat.Prime n.minFac", "width": 77.0625, "height": 6.078125}, {"page": 1, "x": 274.9454970472441, "y": 323.1735383858267, "kind": "lean-hover", "role": "token", "tooltip": "n.factorial + 1 ≠ 1", "width": 14.44921875, "height": 6.078125}, {"page": 1, "x": 291.3947157972441, "y": 325.0516633858267, "kind": "lean-hover", "role": "state", "tooltip": "n : ℕ\np : ℕ := (n.factorial + 1).minFac\nhne : n.factorial + 1 ≠ 1\nhp : Nat.Prime p\n⊢ ∃ p, n ≤ p ∧ Nat.Prime p", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 72.65643454724409, "y": 334.2516633858267, "kind": "lean-hover", "role": "token", "tooltip": "`refine e` behaves like `exact e`, except that named (`?x`) or unnamed (`?_`)\nholes in `e` that are not solved by unification with the main goal's target type\nare converted into new goals, using the hole's name, if any, as the goal case name.\n", "width": 28.8984375, "height": 6.078125}, {"page": 1, "x": 106.37127829724409, "y": 334.2516633858267, "kind": "lean-hover", "role": "token", "tooltip": "Exists.intro.{u} {α : Sort u} {p : α → Prop} (w : α) (h : p w) : Exists p\n\nExistential introduction. If `a : α` and `h : p a`,\nthen `⟨a, h⟩` is a proof that `∃ x : α, p x`. ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 111.18768454724409, "y": 334.2516633858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 116.00409079724409, "y": 334.2516633858267, "kind": "lean-hover", "role": "token", "tooltip": "Exists.intro.{u} {α : Sort u} {p : α → Prop} (w : α) (h : p w) : Exists p\n\nExistential introduction. If `a : α` and `h : p a`,\nthen `⟨a, h⟩` is a proof that `∃ x : α, p x`. ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 125.63690329724409, "y": 334.2516633858267, "kind": "lean-hover", "role": "token", "tooltip": "A *synthetic hole* (or *synthetic placeholder*), which stands for an unknown term that should be synthesized using tactics.\n- `?_` creates a fresh metavariable with an auto-generated name.\n- `?m` either refers to a pre-existing metavariable named `m` or creates a fresh metavariable with that name.\n\nIn particular, the synthetic hole syntax creates \"synthetic opaque metavariables\",\nthe same kind of metavariable used to represent goals in the tactic state.\n\nSynthetic holes are similar to holes in that `_` also creates metavariables,\nbut synthetic opaque metavariables have some different properties:\n- In tactics such as `refine`, only synthetic holes yield new goals.\n- During elaboration, unification will not solve for synthetic opaque metavariables, they are \"opaque\".\n  This is to prevent counterintuitive behavior such as disappearing goals.\n- When synthetic holes appear under binders, they capture local variables using a more complicated mechanism known as delayed assignment.\n\n## Delayed assigned metavariables\n\nThis section gives an overview of some technical details of synthetic holes, which you should feel free to skip.\nUnderstanding delayed assignments is mainly useful for those who are working on tactics and other metaprogramming.\nIt is included here until there is a suitable place for it in the reference manual.\n\nWhen a synthetic hole appears under a binding construct, such as for example `fun (x : α) (y : β) => ?s`,\nthe system creates a *delayed assignment*. This consists of\n1. A metavariable `?m` of type `(x : α) → (y : β) → γ x y` whose local context is the local context outside the `fun`,\n  where `γ x y` is the type of `?s`. Recall that `x` and `y` appear in the local context of `?s`.\n2. A delayed assignment record associating `?m` to `?s` and the variables `#[x, y]` in the local context of `?s`\n\nThen, this function elaborates as `fun (x : α) (y : β) => ?m x y`, where one should understand `x` and `y` here\nas being De Bruijn indexes, since Lean uses the locally nameless encoding of lambda calculus.\n\nOnce `?s` is fully solved for, in the sense that after metavariable instantiation it is a metavariable-free term `e`,\nthen we can make the assignment `?m := fun (x' : α) (y' : β) => e[x := x', y := y']`.\n(Implementation note: Lean only instantiates full applications `?m x' y'` of delayed assigned metavariables, to skip forming this function.)\nThis delayed assignment mechanism is essential to the operation of basic tactics like `intro`,\nand a good mental model is that it is a way to \"apply\" the metavariable `?s` by substituting values in for some of its local variables.\nWhile it would be easier to immediately assign `?s := ?m x y`,\ndelayed assignment preserves `?s` as an unsolved-for metavariable with a local context that still contains `x` and `y`,\nwhich is exactly what tactics like `intro` need.\n\nBy default, delayed assigned metavariables pretty print with what they are delayed assigned to.\nThe delayed assigned metavariables themselves can be pretty printed using `set_option pp.mvars.delayed true`.\n\nFor more information, see the \"Gruesome details\" module docstrings in `Lean.MetavarContext`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 135.2697157972441, "y": 334.2516633858267, "kind": "lean-hover", "role": "token", "tooltip": "Exists.intro.{u} {α : Sort u} {p : α → Prop} (w : α) (h : p w) : Exists p\n\nExistential introduction. If `a : α` and `h : p a`,\nthen `⟨a, h⟩` is a proof that `∃ x : α, p x`. ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 144.9025282972441, "y": 334.2516633858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.Prime p", "width": 9.6328125, "height": 6.078125}, {"page": 1, "x": 154.5353407972441, "y": 334.2516633858267, "kind": "lean-hover", "role": "token", "tooltip": "Exists.intro.{u} {α : Sort u} {p : α → Prop} (w : α) (h : p w) : Exists p\n\nExistential introduction. If `a : α` and `h : p a`,\nthen `⟨a, h⟩` is a proof that `∃ x : α, p x`. ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 161.3517470472441, "y": 336.1297883858267, "kind": "lean-hover", "role": "state", "tooltip": "n : ℕ\np : ℕ := (n.factorial + 1).minFac\nhne : n.factorial + 1 ≠ 1\nhp : Nat.Prime p\n⊢ n ≤ p", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 72.65643454724409, "y": 345.3297883858267, "kind": "lean-hover", "role": "token", "tooltip": "`by_contra h` proves `⊢ p` by contradiction,\nintroducing a hypothesis `h : ¬p` and proving `False`.\n* If `p` is a negation `¬q`, `h : q` will be introduced instead of `¬¬q`.\n* If `p` is decidable, it uses `Decidable.byContradiction` instead of `Classical.byContradiction`.\n* If `h` is omitted, the introduced variable will be called `this`.\n* `h` can be any pattern supported by `rcases`/`rintro`.\n", "width": 43.34765625, "height": 6.078125}, {"page": 1, "x": 120.82049704724409, "y": 345.3297883858267, "kind": "lean-hover", "role": "token", "tooltip": "¬n ≤ p", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 127.63690329724409, "y": 347.2079133858267, "kind": "lean-hover", "role": "state", "tooltip": "n : ℕ\np : ℕ := (n.factorial + 1).minFac\nhne : n.factorial + 1 ≠ 1\nhp : Nat.Prime p\nh : ¬n ≤ p\n⊢ False", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 72.65643454724409, "y": 356.4079133858267, "kind": "lean-hover", "role": "token", "tooltip": "The `have` tactic is for adding opaque definitions and hypotheses to the local context of the main goal.\nThe definitions forget their associated value and cannot be unfolded, unlike definitions added by the `let` tactic.\n\n* `have h : t := e` adds the hypothesis `h : t` if `e` is a term of type `t`.\n* `have h := e` uses the type of `e` for `t`.\n* `have : t := e` and `have := e` use `this` for the name of the hypothesis.\n* `have pat := e` for a pattern `pat` is equivalent to `match e with | pat => _`,\n  where `_` stands for the tactics that follow this one.\n  It is convenient for types that have only one applicable constructor.\n  For example, given `h : p ∧ q ∧ r`, `have ⟨h₁, h₂, h₃⟩ := h` produces the\n  hypotheses `h₁ : p`, `h₂ : q`, and `h₃ : r`.\n* The syntax `have (eq := h) pat := e` is equivalent to `match h : e with | pat => _`,\n  which adds the equation `h : e = pat` to the local context.\n\nThe tactic supports all the same syntax variants and options as the `have` term.\n\n## Properties and relations\n\n* It is not possible to unfold a variable introduced using `have`, since the definition's value is forgotten.\n  The `let` tactic introduces definitions that can be unfolded.\n* The `have h : t := e` is like doing `let h : t := e; clear_value h`.\n* The `have` tactic is preferred for propositions, and `let` is preferred for non-propositions.\n* Sometimes `have` is used for non-propositions to ensure that the variable is never unfolded,\n  which may be important for performance reasons.\n    Consider using the equivalent `let +nondep` to indicate the intent.\n\n", "width": 19.265625, "height": 6.078125}, {"page": 1, "x": 96.73846579724409, "y": 356.4079133858267, "kind": "lean-hover", "role": "token", "tooltip": "p ≤ n", "width": 28.8984375, "height": 6.078125}, {"page": 1, "x": 140.0861220472441, "y": 356.4079133858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 149.7189345472441, "y": 356.4079133858267, "kind": "lean-hover", "role": "token", "tooltip": "The less-equal relation: `x ≤ y` \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `≤` in identifiers is `le`.", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 159.3517470472441, "y": 356.4079133858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 183.4337782 t for types that have only one applicable constructor.\n  For example, given `h : p ∧ q ∧ r`, `have ⟨h₁, h₂, h₃⟩ := h` produces the\n  hypotheses `h₁ : p`, `h₂ : q`, and `h₃ : r`.\n* The syntax `have (eq := h) pat := e` is equivalent to `match h : e with | pat => _`,\n  which adds the equation `h : e = pat` to the local context.\n\nThe tactic supports all the same syntax variants and options as the `have` term.\n\n## Properties and relations\n\n* It is not possible to unfold a variable introduced using `have`, since the definition's value is forgotten.\n  The `let` tactic introduces definitions that can be unfolded.\n* The `have h : t := e` is like doing `let h : t := e; clear_value h`.\n* The `have` tactic is preferred for propositions, and `let` is preferred for non-propositions.\n* Sometimes `have` is used for non-propositions to ensure that the variable is never unfolded,\n  which may be important for performance reasons.\n    Consider using the equivalent `let +nondep` to indicate the intent.\n\n", "width": 19.265625, "height": 6.078125}, {"page": 1, "x": 96.73846579724409, "y": 367.4860383858267, "kind": "lean-hover", "role": "token", "tooltip": "p ∣ n.factorial", "width": 19.265625, "height": 6.078125}, {"page": 1, "x": 130.4533095472441, "y": 367.4860383858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 140.0861220472441, "y": 367.4860383858267, "kind": "lean-hover", "role": "token", "tooltip": "Divisibility. `a ∣ b` (typed as `\\|`) means that there is some `c` such that `b = a * c`. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `∣` in identifiers is `dvd`.", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 149.7189345472441, "y": 367.4860383858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 159.3517470472441, "y": 367.4860383858267, "kind": "lean-hover", "role": "token", "t ht": 6.078125}, {"page": 1, "x": 212.3322157972441, "y": 378.5641633858267, "kind": "lean-hover", "role": "token", "tooltip": "`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 221.9650282972441, "y": 378.5641633858267, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 246.0470595472441, "y": 378.5641633858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.minFac_dvd (n : ℕ) : n.minFac ∣ n", "width": 67.4296875, "height": 6.078125}, {"page": 1, "x": 325.1095595472441, "y": 380.4422883858267, "kind": "lean-hover", "role": "state", "tooltip": "n : ℕ\np : ℕ := (n.factorial + 1).minFac\nhne : n.factorial + 1 ≠ 1\nhp : Nat.Prime p\nh : ¬n ≤ p\nhsmall : p ≤ n\nhfac : p ∣ n.factorial\nhnext : p ∣ n.factorial + 1\n⊢ False", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 72.65643454724409, "y": 389.6422883858267, "kind": "lean-hover", "role": "token", "tooltip": "The `have` tactic is for adding opaque definitions and hypotheses to the local context of the main goal.\nThe definitions forget their associated value and cannot be unfolded, unlike definitions added by the `let` tactic.\n\n* `have h : t := e` adds the hypothesis `h : t` if `e` is a term of type `t`.\n* `have h := e` uses the type of `e` for `t`.\n* `have : t := e` and `have := e` use `this` for the name of the hypothesis.\n* `have pat := e` for a pattern `pat` is equivalent to `match e with | pat => _`,\n  where `_` stands for the tactics that follow this one.\n  It is convenient for types that have only one applicable constructor.\n  For example, given `h : p ∧ q ∧ r`, `have ⟨h₁, h₂, h₃⟩ := h` produces the\n  hypotheses `h₁ : p`, `h₂ : q`, and `h₃ : r`.\n* The syntax `have (eq := h) pat := e` is equivalent to `match h : e  19.265625, "height": 6.078125}, {"page": 1, "x": 303.8439345472441, "y": 389.6422883858267, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 313.4767470472441, "y": 389.6422883858267, "kind": "lean-hover", "role": "token", "tooltip": "Iff.mpr {a b : Prop} (self : a ↔ b) : b → a\n\nModus ponens for if and only if, reversed. If `a ↔ b` and `b`, then `a`. ", "width": 14.44921875, "height": 6.078125}, {"page": 1, "x": 332.7423720472441, "y": 389.6422883858267, "kind": "lean-hover", "role": "token", "tooltip": "p ∣ n.factorial + 1", "width": 24.08203125, "height": 6.078125}, {"page": 1, "x": 358.8244032972441, "y": 391.5204133858267, "kind": "lean-hover", "role": "state", "tooltip": "n : ℕ\np : ℕ := (n.factorial + 1).minFac\nhne : n.factorial + 1 ≠ 1\nhp : Nat.Prime p\nh : ¬n ≤ p\nhsmall : p ≤ n\nhfac : p ∣ n.factorial\nhnext : p ∣ n.factorial + 1\nhone : p ∣ 1\n⊢ False", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 72.65643454724409, "y": 400.7204133858267, "kind": "lean-hover", "role": "token", "tooltip": "`exact e` closes the main goal if its target type matches that of `e`.\n", "width": 24.08203125, "height": 6.078125}, {"page": 1, "x": 101.55487204724409, "y": 400.7204133858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.Prime p", "width": 9.6328125, "height": 6.078125}, {"page": 1, "x": 116.00409079724409, "y": 400.7204133858267, "kind": "lean-hover", "role": "token", "tooltip": "Nat.Prime.not_dvd_one {p : ℕ} (pp : Nat.Prime p) : ¬p ∣ 1", "width": 52.98046875, "height": 6.078125}, {"page": 1, "x": 173.8009657972441, "y": 400.7204133858267, "kind": "lean-hover", "role": "token", "tooltip": "p ∣ 1", "width": 19.265625, "height": 6.078125}, {"page": 1, "x": 195.0665907972441, "y": 402.5985383858267, "kind": "lean-hover", "role": "state", "tooltip": "No goals", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 101.55487204724409, "y": 493.0385383858268, "kind": "lean-hover", "role": "token", "tooltip": "Demo.infinitely_many_primes : {p | Nat.Prime p}.Infinite\n\nEquivalently, the set of natural-number primes is infinite. ", "width": 105.9609375, "height": 6.078125}, {"page": 1, "x": 221.9650282972441, "y": 493.0385383858268, "kind": "lean-hover", "role": "token", "tooltip": "Set builder syntax. This can be elaborated to either a `Set` or a `Finset` depending on context.\n\nThe elaborators for this syntax are located in:\n* `Data.Set.Defs` for the `Set` builder notation elaborator for syntax of the form `{x | p x}`,\n  `{x : α | p x}`, `{binder x | p x}`.\n* `Data.Finset.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x ∈ s | p x}`.\n* `Data.Fintype.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x | p x}`, `{x : α | p x}`, `{x ∉ s | p x}`, `{x ≠ a | p x}`.\n* `Order.LocallyFinite.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x ≤ a | p x}`, `{x ≥ a | p x}`, `{x \u003c a | p x}`, `{x > a | p x}`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 226.7814345472441, "y": 493.0385383858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 246.0470595472441, "y": 493.0385383858268, "kind": "lean-hover", "role": "token", "tooltip": "Nat : Type\n\nThe natural numbers, starting at zero.\n\nThis type is special-cased by both the kernel and the compiler, and overridden with an efficient\nimplementation. Both use a fast arbitrary-precision arithmetic library (usually\n[GMP](https://gmplib.org/)); at runtime, `Nat` values that are sufficiently small are unboxed.\n", "width": 14.44921875, "height": 6.078125}, {"page": 1, "x": 265.3126845472441, "y": 493.0385383858268, "kind": "lean-hover", "role": "token", "tooltip": "Set builder syntax. This can be elaborated to either a `Set` or a `Finset` depending on context.\n\nThe elaborators for this syntax are located in:\n* `Data.Set.Defs` for the `Set` builder notation elaborator for syntax of the form `{x | p x}`,\n  `{x : α | p x}`, `{binder x | p x}`.\n* `Data.Finset.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x ∈ s | p x}`.\n* `Data.Fintype.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x | p x}`, `{x : α | p x}`, `{x ∉ s | p x}`, `{x ≠ a | p x}`.\n* `Order.LocallyFinite.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x ≤ a | p x}`, `{x ≥ a | p x}`, `{x \u003c a | p x}`, `{x > a | p x}`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 274.9454970472441, "y": 493.0385383858268, "kind": "lean-hover", "role": "token", "tooltip": "Nat.Prime (p : ℕ) : Prop\n\n`Nat.Prime p` means that `p` is a prime number, that is, a natural number\nat least 2 whose only divisors are `p` and `1`.\nThe theorem `Nat.prime_def` witnesses this description of a prime number. ", "width": 43.34765625, "height": 6.078125}, {"page": 1, "x": 323.1095595472441, "y": 493.0385383858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 327.9259657972441, "y": 493.0385383858268, "kind": "lean-hover", "role": "token", "tooltip": "Set builder syntax. This can be elaborated to either a `Set` or a `Finset` depending on context.\n\nThe elaborators for this syntax are located in:\n* `Data.Set.Defs` for the `Set` builder notation elaborator for syntax of the form `{x | p x}`,\n tor for syntax of the form `{x | p x}`,\n  `{x : α | p x}`, `{binder x | p x}`.\n* `Data.Finset.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x ∈ s | p x}`.\n* `Data.Fintype.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x | p x}`, `{x : α | p x}`, `{x ∉ s | p x}`, `{x ≠ a | p x}`.\n* `Order.LocallyFinite.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x ≤ a | p x}`, `{x ≥ a | p x}`, `{x \u003c a | p x}`, `{x > a | p x}`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 197.8829970472441, "y": 515.1947883858268, "kind": "lean-hover", "role": "token", "tooltip": "Nat.Prime (p : ℕ) : Prop\n\n`Nat.Prime p` means that `p` is a prime number, that is, a natural number\nat least 2 whose only divisors are `p` and `1`.\nThe theorem `Nat.prime_def` witnesses this description of a prime number. ", "width": 43.34765625, "height": 6.078125}, {"page": 1, "x": 246.0470595472441, "y": 515.1947883858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 250.8634657972441, "y": 515.1947883858268, "kind": "lean-hover", "role": "token", "tooltip": "Set builder syntax. This can be elaborated to either a `Set` or a `Finset` depending on context.\n\nThe elaborators for this syntax are located in:\n* `Data.Set.Defs` for the `Set` builder notation elaborator for syntax of the form `{x | p x}`,\n  `{x : α | p x}`, `{binder x | p x}`.\n* `Data.Finset.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x ∈ s | p x}`.\n* `Data.Fintype.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x | p x}`, `{x : α | p x}`, `{x ∉ s | p x}`, `{x ≠ a | p x}`.\n* `Order.LocallyFinite.Basic` for the `Finset` builder notation elaborator for syntax of the form\n  `{x ≤ a | p x}`, `{x ≥ a | p x}`, `{x \u003c a | p x}`, `{x > a | p x}`.\n", "width": 4.81640625, "height": 6.078125}, {" ": "state", "tooltip": "h : ¬{p | Nat.Prime p}.Infinite\nhfinite : {p | Nat.Prime p}.Finite\nbound : ℕ\nhbound : bound ∈ upperBounds {p | Nat.Prime p}\n⊢ False", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 72.65643454724409, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "The `obtain` tactic is a combination of `have` and `rcases`. See `rcases` for\na description of supported patterns.\n\n```lean\nobtain ⟨patt⟩ : type := proof\n```\nis equivalent to\n```lean\nhave h : type := proof\nrcases h with ⟨patt⟩\n```\n\nIf `⟨patt⟩` is omitted, `rcases` will try to infer the pattern.\n\nIf `type` is omitted, `:= proof` is required.\n", "width": 28.8984375, "height": 6.078125}, {"page": 1, "x": 106.37127829724409, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "`⟨pat, ...⟩` is a pattern which matches on a tuple-like constructor\nor multi-argument inductive constructor\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 111.18768454724409, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 116.00409079724409, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "`⟨pat, ...⟩` is a pattern which matches on a tuple-like constructor\nor multi-argument inductive constructor\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 125.63690329724409, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "bound + 1 ≤ p", "width": 28.8984375, "height": 6.078125}, {"page": 1, "x": 154.5353407972441, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "`⟨pat, ...⟩` is a pattern which matches on a tuple-like constructor\nor multi-argument inductive constructor\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 164.1681532972441, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "Nat.Prime p", "width": 9.6328125, "height": 6.078125}, {"page": 1, "x": 173.8009657972441, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "`⟨pat, ...⟩` is a pattern which matches on a tuple-like constructor\nor multi-argument inductive constructor\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 183.4337782972441, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "The `obtain` tactic is a combination of `have` and `rcases`. See `rcases` for\na description of supported patterns.\n\n```lean\nobtain ⟨patt⟩ : type := proof\n```\nis equivalent to\n```lean\nhave h : type := proof\nrcases h with ⟨patt⟩\n```\n\nIf `⟨patt⟩` is omitted, `rcases` will try to infer the pattern.\n\nIf `type` is omitted, `:= proof` is required.\n", "width": 9.6328125, "height": 6.078125}, {"page": 1, "x": 197.8829970472441, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "Demo.prime_above (n : ℕ) : ∃ p, n ≤ p ∧ Nat.Prime p\n\nEuclid's factorial-plus-one argument: primes have no upper bound. ", "width": 52.98046875, "height": 6.078125}, {"page": 1, "x": 260.4962782972441, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 24.08203125, "height": 6.078125}, {"page": 1, "x": 289.3947157972441, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 299.0275282972441, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 303.8439345472441, "y": 537.3510383858268, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 310.6603407972441, "y": 539.2291633858268, "kind": "lean-hover", "role": "state", "tooltip": "h : ¬{p | Nat.Prime p}.Infinite\nhfinite : {p | Nat.Prime p}.Finite\nbound : ℕ\nhbound : bound ∈ upperBounds {p | Nat.Prime p}\np : ℕ\nhlarge : bound + 1 ≤ p\nhp : Nat.Prime p\n⊢ False", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 72.65643454724409, "y": 548.4291633858268, "kind": "lean-hover", "role": "token", "tooltip": "The `have` tactic is for adding opaque definitions and hypotheses to the local context of the main goal.\nThe definitions forget their associated value and cannot be unfolded, unlike definitions added by the `let` tactic.\n\n* `have h : t := e` adds the hypothesis `h : t` if `e` is a term of type `t`.\n* `have h := e` uses the type of `e` for `t`.\n* `have : t := e` and `have := e` use `this` for the name of the hypothesis.\n* `have pat := e` for a pattern `pat` is equivalent to `match e with | pat => _`,\n  where `_` stands for the tactics that follow this one.\n  It is convenient for types that have only one applicable constructor.\n  For example, given `h : p ∧ q ∧ r`, `have ⟨h₁, h₂, h₃⟩ := h` produces the\n  hypotheses `h₁ : p`, `h₂ : q`, and `h₃ : r`.\n* The syntax `have (eq := h) pat := e` is equivalent to `match h : e with | pat => _`,\n  which adds the equation `h : e = pat` to the local context.\n\nThe tactic supports all the same syntax variants and options as the `have` term.\n\n## Properties and relations\n\n* It is not possible to unfold a variable introduced using `have`, since the definition's value is forgotten.\n  The `let` tactic introduces definitions that can be unfolded.\n* The `have h : t := e` is like doing `let h : t := e; clear_value h`.\n* The `have` tactic is preferred for propositions, and `let` is preferred for non-propositions.\n* Sometimes `have` is used for non-propositions to ensure that the variable is never unfolded,\n  which may be important for performance reasons.\n    Consider using the equivalent `let +nondep` to indicate the intent.\n\n", "width": 19.265625, "height": 6.078125}, {"page": 1, "x": 96.73846579724409, "y": 548.4291633858268, "kind": "lean-hover", "role": "token", "tooltip": "p ≤ bound", "width": 14.44921875, "height": 6.078125}, {"page": 1, "x": 125.63690329724409, "y": 548.4291633858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 135.2697157972441, "y": 548.4291633858268, "kind": "lean-hover", "role": "token", "tooltip": "The less-equal relation: `x ≤ y` \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `≤` in identifiers is `le`.", "width": 4.81640625, "height": 6.078125}, {"page": 1, "x": 144.9025282972441, "y": 548.4291633858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 24.08203125, "height": 6.078125}, {"page": 1, "x": 188.2501845472441, "y": 548.4291633858268, "kind": "lean-hover", "role": "token", "tooltip": "bound ∈ upperBounds {p | Nat.Prime p}", "width": 28.8984375, "height": 6.078125}, {"page": 1, "x": 221.9650282972441, "y": 548.4291633858268, "kind": "lean-hover", "role": "token", "tooltip": "Nat.Prime p", "width": 9.6328125, "height": 6.078125}, {"page": 1, "x": 233.5978407972441, "y": 550.3072883858268, "kind": "lean-hover", "role": "state", "tooltip": "h : ¬{p | Nat.Prime p}.Infinite\nhfinite : {p | Nat.Prime p}.Finite\nbound : ℕ\nhbound : bound ∈ upperBounds {p | Nat.Prime p}\np : ℕ\nhlarge : bound + 1 ≤ p\nhp : Nat.Prime p\nhle : p ≤ bound\n⊢ False", "width": 7.5, "height": 4.200000000000001}, {"page": 1, "x": 72.65643454724409, "y": 559.5072883858268, "kind": "lean-hover", "role": "token", "tooltip": "`lia` solves linear integer arithmetic goals.\n\nIt is a implemented as a thin wrapper around the `grind` tactic, enabling only the `lia` solver.\nPlease use `grind` instead if you need additional capabilities.\n\nLike `grind`, it accepts a list of extra facts and lemmas, e.g. `lia [foo n, = bar]`.\n", "width": 14.44921875, "height": 6.078125}, {"page": 1, "x": 89.10565329724409, "y": 561.3854133858268, "kind": "lean-hover", "role": "state", "tooltip": "No goals", "width": 7.5, "height": 4.200000000000001}], "headings": [{"level": 1, "title": "There are infinitely many primes", "page": 1, "y": 56.69291338582677, "id": "heading-1"}, {"level": 2, "title": "The Lean formalization", "page": 1, "y": 195.30291338582674, "id": "heading-2"}]}, {"svg": "\u003csvg viewBox=\"0 0 498.897637795 708.661417323\" width=\"498.897637795pt\" height=\"708.661417323pt\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xmlns:h5=\"http://www.w3.org/1999/xhtml\">\u003cpath fill=\"#ffffff\" fill-rule=\"nonzero\" d=\"M 0 0v 708.661417323h 498.897637795v -708.661417323Z \"/>\u003cg transform=\"translate(51.023622047 56.692913386)\">\u003cg transform=\"matrix(1 0 0 -1 0 9.03)\">\u003cuse xlink:href=\"#gF77C6D35453050122DE945A94386C276\" x=\"0\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#gC5F956A1F0C1C74B262F9D04B2970C9D\" x=\"8.526\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#gE5FD10D3FF7EA9BB0202ECB413CE08E3\" x=\"15.82\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#gBCED2652AEDF5E1BD51C7C189741D6EF\" x=\"22.666\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#gF7A0B818597AAA0E498B49C4E32FF26D\" x=\"28.868\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#g8311E5CB6115D60973096FEA6050DC9B\" x=\"40.18\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"  "kind": "lean-hover", "role": "token", "tooltip": "Demo.double_is_even (n : ℕ) : Even (n + n)\n\nAdding a natural number to itself gives an even number. ", "width": 67.4296875, "height": 6.078125}, {"page": 2, "x": 173.8009657972441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 178.6173720472441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 188.2501845472441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 197.8829970472441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "Nat : Type\n\nThe natural numbers, starting at zero.\n\nThis type is special-cased by both the kernel and the compiler, and overridden with an efficient\nimplementation. Both use a fast arbitrary-precision arithmetic library (usually\n[GMP](https://gmplib.org/)); at runtime, `Nat` values that are sufficiently small are unboxed.\n", "width": 14.44921875, "height": 6.078125}, {"page": 2, "x": 212.3322157972441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 231.5978407972441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "Even.{u_2} {α : Type u_2} [Add α] (a : α) : Prop\n\nAn element `a` of a type `α` with addition satisfies `Even a` if `a = r + r`,\nfor some `r : α`. ", "width": 19.265625, "height": 6.078125}, {"page": 2, "x": 260.4962782972441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 270.1290907972441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 279.7619032972441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 284.5783095472441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 308.6603407972441, "y": 222.54291338582675, "kind": "lean-hover", "role": "token", "tooltip": "`by tac` constructs a term of the expected type by running the tactic(s) `tac`. ", "width": 9.6328125, "height": 6.078125}, {"page": 2, "x": 320.2931532972441, "y": 224.42103838582673, "kind": "lean-hover", "role": "state", "tooltip": "n : ℕ\n⊢ Even (n + n)", "width": 7.5, "height": 4.200000000000001}, {"page": 2, "x": 72.65643454724409, "y": 233.62103838582675, "kind": "lean-hover", "role": "token", "tooltip": "`exact e` closes the main goal if its target type matches that of `e`.\n", "width": 24.08203125, "height": 6.078125}, {"page": 2, "x": 101.55487204724409, "y": 233.62103838582675, "kind": "lean-hover", "role": "token", "tooltip": "Exists.intro.{u} {α : Sort u} {p : α → Prop} (w : α) (h : p w) : Exists p\n\nExistential introduction. If `a : α` and `h : p a`,\nthen `⟨a, h⟩` is a proof that `∃ x : α, p x`. ", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 106.37127829724409, "y": 233.62103838582675, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 111.18768454724409, "y": 233.62103838582675, "kind": "lean-hover", "role": "token", "tooltip": "Exists.intro.{u} {α : Sort u} {p : α → Prop} (w : α) (h : p w) : Exists p\n\nExistential introduction. If `a : α` and `h : p a`,\nthen `⟨a, h⟩` is a proof that `∃ x : α, p x`. ", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 120.82049704724409, "y": 233.62103838582675, "kind": "lean-hover", "role": "token", "tooltip": "rfl.{u} {α : Sort u} {a : α} : a = a\n\n`rfl : a = a` is the unique constructor of the equality type. This is the\nsame as `Eq.refl` except that it takes `a` implicitly instead of explicitly.\n\nThis is a more powerful theorem than it may appear at first, because although\nthe statement of the theorem is `a = a`, Lean will allow anything that is\ndefinitionally equal to that type. So, for instance, `2 + 2 = 4` is proven in\nLean by `rfl`, because both sides are the same up to definitional equality.\n", "width": 14.44921875, "height": 6.078125}, {"page": 2, "x": 135.2697157972441, "y": 233.62103838582675, "kind": "lean-hover", "role": "token", "tooltip": "Exists.intro.{u} {α : Sort u} {p : α → Prop} (w : α) (h : p w) : Exists p\n\nExistential introduction. If `a : α` and `h : p a`,\nthen `⟨a, h⟩` is a proof that `∃ x : α, p x`. ", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 142.0861220472441, "y": 235.49916338582673, "kind": "lean-hover", "role": "state", "tooltip": "No goals", "width": 7.5, "height": 4.200000000000001}, {"page": 2, "x": 61.023622047244096, "y": 292.2791633858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 80.28924704724409, "y": 292.2791633858268, "kind": "lean-hover", "role": "token", "tooltip": "Nat : Type\n\nThe natural numbers, starting at zero.\n\nThis type is special-cased by both the kernel and the compiler, and overridden with an efficient\nimplementation. Both use a fast arbitrary-precision arithmetic library (usually\n[GMP](https://gmplib.org/)); at runtime, `Nat` values that are sufficiently small are unboxed.\n", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 70.65643454724409, "y": 303.3572883858268, "kind": "lean-hover", "role": "token", "tooltip": "Even.{u_2} {α : Type u_2} [Add α] (a : α) : Prop\n\nAn element `a` of a type `α` with addition satisfies `Even a` if `a = r + r`,\nfor some `r : α`. ", "width": 19.265625, "height": 6.078125}, {"page": 2, "x": 94.73846579724409, "y": 303.3572883858268, "kind": "lean-hover", "role": "token", "tooltip": "HAdd.hAdd.{u, v, w} {α : Type u} {β : Type v} {γ : outParam (Type w)} [self : HAdd α β γ] : α → β → γ\n\n`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 99.55487204724409, "y": 303.3572883858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 109.18768454724409, "y": 303.3572883858268, "kind": "lean-hover", "role": "token", "tooltip": "HAdd.hAdd.{u, v, w} {α : Type u} {β : Type v} {γ : outParam (Type w)} [self : HAdd α β γ] : α → β → γ\n\n`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 118.82049704724409, "y": 303.3572883858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 2, "x": 123.63690329724409, "y": 303.3572883858268, "kind": "lean-hover", "role": "token", "tooltip": "HAdd.hAdd.{u, v, w} {α : Type u} {β : Type v} {γ : outParam (Type w)} [self : HAdd α β γ] : α → β → γ\n\n`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}], "headings": [{"level": 1, "title": "Every double is even", "page": 2, "y": 56.69291338582677, "id": "heading-3"}, {"level": 2, "title": "A witness and an equality", "page": 2, "y": 163.64291338582674, "id": "heading-4"}]}, {"svg": "\u003csvg viewBox=\"0 0 498.897637795 708.661417323\" width=\"498.897637795pt\" height=\"708.661417323pt\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xmlns:h5=\"http://www.w3.org/1999/xhtml\">\u003cpath fill=\"#ffffff\" fill-rule=\"nonzero\" d=\"M 0 0v 708.661417323h 498.897637795v -708.661417323Z \"/>\u003cg transform=\"translate(51.023622047 56.692913386)\">\u003cg transform=\"matrix(1 0 0 -1 0 9.03)\">\u003cuse xlink:href=\"#g3D6DBA0FEA31A097ABD16C21D41603AF\" x=\"0\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#g73F51EC0D37145DDB3B7EC3F24DFF62B\" x=\"7.056\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#g31D840B6B63A7EE7E70CA68EFA5F5064\" x=\"17.934\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#g842B59A75253BA9D4A8347431413305C\" x=\"25.018\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#g842B59A75253BA9D4A8347431413305C\" x=\"33.152\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#g3031F2A74E6705603EA1FB9D4A12911B\" x=\"41.2 3c/symbol>\u003c/defs>\u003c/svg>", "width": 498.897637795, "height": 708.661417323, "regions": [{"page": 3, "x": 101.55487204724409, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "Demo.addition_commutes (m n : ℕ) : m + n = n + m\n\nSwapping the order of two natural-number summands preserves their sum. ", "width": 81.87890625, "height": 6.078125}, {"page": 3, "x": 188.2501845472441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 193.0665907972441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 202.6994032972441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 212.3322157972441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 221.9650282972441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "Nat : Type\n\nThe natural numbers, starting at zero.\n\nThis type is special-cased by both the kernel and the compiler, and overridden with an efficient\nimplementation. Both use a fast arbitrary-precision arithmetic library (usually\n[GMP](https://gmplib.org/)); at runtime, `Nat` values that are sufficiently small are unboxed.\n", "width": 14.44921875, "height": 6.078125}, {"page": 3, "x": 236.4142470472441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 255.6798720472441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 265.3126845472441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 274.9454970472441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 284.5783095472441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "The equality relation. It has one introduction rule, `Eq.refl`.\nWe use `a = b` as notation for `Eq a b`.\nA fundamental property of equality is that it is an equivalence relation.\n```\nvariable (α : Type) (a b c d : α)\nvariable (hab : a = b) (hcb : c = b) (hcd : c = d)\n\nexample : a = d :=\n  Eq.trans (Eq.trans hab (Eq.symm hcb)) hcd\n```\nEquality is much more than an equivalence relation, however. It has the important property that every assertion\nrespects the equivalence, in the sense that we can substitute equal expressions without changing the truth value.\nThat is, given `h1 : a = b` and `h2 : p a`, we can construct a proof for `p b` using substitution: `Eq.subst h1 h2`.\nExample:\n```\nexample (α : Type) (a b : α) (p : α → Prop)\n        (h1 : a = b) (h2 : p a) : p b :=\n  Eq.subst h1 h2\n\nexample (α : Type) (a b : α) (p : α → Prop)\n    (h1 : a = b) (h2 : p a) : p b :=\n  h1 ▸ h2\n```\nThe triangle in the second presentation is a macro built on top of `Eq.subst` and `Eq.symm`, and you can enter it by typing `\\t`.\nFor more information: [Equality](https://lean-lang.org/theorem_proving_in_lean4/quantifiers_and_equality.html#equality)\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `=` in identifiers is `eq`.", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 294.2111220472441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 303.8439345472441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 313.4767470472441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 337.5587782972441, "y": 249.20291338582678, "kind": "lean-hover", "role": "token", "tooltip": "`by tac` constructs a term of the expected type by running the tactic(s) `tac`. ", "width": 9.6328125, "height": 6.078125}, {"page": 3, "x": 349.1915907972441, "y": 251.08103838582676, "kind": "lean-hover", "role": "state", "tooltip": "m : ℕ\nn : ℕ\n⊢ m + n = n + m", "width": 7.5, "height": 4.200000000000001}, {"page": 3, "x": 72.65643454724409, "y": 260.2810383858268, "kind": "lean-hover", "role": "token", "tooltip": "Assuming `x` is a variable in the local context with an inductive type,\n`induction x` applies induction on `x` to the main goal,\nproducing one goal for each constructor of the inductive type,\nin which the target is replaced by a general instance of that constructor\nand an inductive hypothesis is added for each recursive argument to the constructor.\nIf the type of an element in the local context depends on `x`,\nthat element is reverted and reintroduced afterward,\nso that the inductive hypothesis incorporates that hypothesis as well.\n\nFor example, given `n : Nat` and a goal with a hypothesis `h : P n` and target `Q n`,\n`induction n` produces one goal with hypothesis `h : P 0` and target `Q 0`,\nand one goal with hypotheses `h : P (Nat.succ a)` and `ih₁ : P a → Q a` and target `Q (Nat.succ a)`.\nHere the names `a` and `ih₁` are chosen automatically and are not accessible.\nYou can use `with` to provide the variables names for each constructor.\n- `induction e`, where `e` is an expression instead of a variable,\n  generalizes `e` in the goal, and then performs induction on the resulting variable.\n- `induction e using r` allows the user to specify the principle of induction that should be used.\n  Here `r` should be a term whose result type must be of the form `C t`,\n  where `C` is a bound variable and `t` is a (possibly empty) sequence of bound variables\n- `induction e generalizing z₁ ... zₙ`, where `z₁ ... zₙ` are variables in the local context,\n  generalizes over `z₁ ... zₙ` before applying the induction but then introduces them in each goal.\n  In other words, the net effect is that each inductive hypothesis is generalized.\n- Given `x : Nat`, `induction x with | zero => tac₁ | succ x' ih => tac₂`\n  uses tactic `tac₁` for the `zero` case, and `tac₂` for the `succ` case.\n", "width": 43.34765625, "height": 6.078125}, {"page": 3, "x": 120.82049704724409, "y": 260.2810383858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 130.4533095472441, "y": 260.2810383858268, "kind": "lean-hover", "role": "token", "tooltip": "After `with`, there is an optional tactic that runs on all branches, and\nthen a list of alternatives.\n", "width": 19.265625, "height": 6.078125}, {"page": 3, "x": 72.65643454724409, "y": 271.3591633858268, "kind": "lean-hover", "role": "token", "tooltip": "The left hand side of an induction arm, `| foo a b c` or `| @foo a b c`\nwhere `foo` is a constructor of the inductive type and `a b c` are the arguments\nto the constructor.\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 82.28924704724409, "y": 271.3591633858268, "kind": "lean-hover", "role": "token", "tooltip": "Nat.zero : ℕ\n\nZero, the smallest natural number.\n\nUsing `Nat.zero` explicitly should usually be avoided in favor of the literal `0`, which is the\n[simp normal form](https://lean-lang.org/doc/reference/4.35.0/find/?domain=Verso.Genre.Manual.section&name=simp-normal-forms).\n", "width": 19.265625, "height": 6.078125}, {"page": 3, "x": 118.00409079724409, "y": 273.2372883858268, "kind": "lean-hover", "role": "state", "tooltip": "case zero\nm : ℕ\n⊢ m + 0 = 0 + m", "width": 7.5, "height": 4.200000000000001}, {"page": 3, "x": 130.3204970472441, "y": 271.3591633858268, "kind": "lean-hover", "role": "token", "tooltip": "The `simp` tactic uses lemmas and hypotheses to simplify the main goal target or\nnon-dependent hypotheses. It has many variants:\n- `simp` simplifies the main goal target using lemmas tagged with the attribute `[simp]`.\n- `simp [h₁, h₂, ..., hₙ]` simplifies the main goal target using the lemmas tagged\n  with the attribute `[simp]` and the given `hᵢ`'s, where the `hᵢ`'s are expressions.-\n- If an `hᵢ` is a defined constant `f`, then `f` is unfolded. If `f` has equational lemmas associated\n  with it (and is not a projection or a `reducible` definition), these are used to rewrite with `f`.\n- `simp [*]` simplifies the main goal target using the lemmas tagged with the\n  attribute `[simp]` and all hypotheses.\n- `simp only [h₁, h₂, ..., hₙ]` is like `simp [h₁, h₂, ..., hₙ]` but does not use `[simp]` lemmas.\n- `simp [-id₁, ..., -idₙ]` simplifies the main goal target using the lemmas tagged\n  with the attribute `[simp]`, but removes the ones named `idᵢ`.\n- `simp at h₁ h₂ ... hₙ` simplifies the hypotheses `h₁ : T₁` ... `hₙ : Tₙ`. If\n  the target or another hypothesis depends on `hᵢ`, a new simplified hypothesis\n  `hᵢ` is introduced, but the old one remains in the local context.\n- `simp at *` simplifies all the hypotheses and the target.\n- `simp [*] at *` simplifies target and all (propositional) hypotheses using the\n  other hypotheses.\n", "width": 19.265625, "height": 6.078125}, {"page": 3, "x": 151.5861220472441, "y": 273.2372883858268, "kind": "lean-hover", "role": "state", "tooltip": "No goals", "width": 7.5, "height": 4.200000000000001}, {"page": 3, "x": 72.65643454724409, "y": 282.4372883858268, "kind": "lean-hover", "role": "token", "tooltip": "The left hand side of an induction arm, `| foo a b c` or `| @foo a b c`\nwhere `foo` is a constructor of the inductive type and `a b c` are the arguments\nto the constructor.\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 82.28924704724409, "y": 282.4372883858268, "kind": "lean-hover", "role": "token", "tooltip": "Nat.succ (n : ℕ) : ℕ\n\nThe successor of a natural number `n`.\n\nUsing `Nat.succ n` should usually be avoided in favor of `n + 1`, which is the [simp normal\nform](https://lean-lang.org/doc/reference/4.35.0/find/?domain=Verso.Genre.Manual.section&name=simp-normal-forms).\n", "width": 19.265625, "height": 6.078125}, {"page": 3, "x": 106.37127829724409, "y": 282.4372883858268, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 116.00409079724409, "y": 282.4372883858268, "kind": "lean-hover", "role": "token", "tooltip": "m + n = n + m", "width": 9.6328125, "height": 6.078125}, {"page": 3, "x": 142.0861220472441, "y": 284.3154133858268, "kind": "lean-hover", "role": "state", "tooltip": "case succ\nm : ℕ\nn : ℕ\nih : m + n = n + m\n⊢ m + (n + 1) = n + 1 + m", "width": 7.5, "height": 4.200000000000001}, {"page": 3, "x": 154.4025282972441, "y": 282.4372883858268, "kind": "lean-hover", "role": "token", "tooltip": "The `simp` tactic uses lemmas and hypotheses to simplify the main goal target or\nnon-dependent hypotheses. It has many variants:\n- `simp` simplifies the main goal target using lemmas tagged with the attribute `[simp]`.\n- `simp [h₁, h₂, ..., h l target or\nnon-dependent hypotheses. It has many variants:\n- `simp` simplifies the main goal target using lemmas tagged with the attribute `[simp]`.\n- `simp [h₁, h₂, ..., hₙ]` simplifies the main goal target using the lemmas tagged\n  with the attribute `[simp]` and the given `hᵢ`'s, where the `hᵢ`'s are expressions.-\n- If an `hᵢ` is a defined constant `f`, then `f` is unfolded. If `f` has equational lemmas associated\n  with it (and is not a projection or a `reducible` definition), these are used to rewrite with `f`.\n- `simp [*]` simplifies the main goal target using the lemmas tagged with the\n  attribute `[simp]` and all hypotheses.\n- `simp only [h₁, h₂, ..., hₙ]` is like `simp [h₁, h₂, ..., hₙ]` but does not use `[simp]` lemmas.\n- `simp [-id₁, ..., -idₙ]` simplifies the main goal target using the lemmas tagged\n  with the attribute `[simp]`, but removes the ones named `idᵢ`.\n- `simp at h₁ h₂ ... hₙ` simplifies the hypotheses `h₁ : T₁` ... `hₙ : Tₙ`. If\n  the target or another hypothesis depends on `hᵢ`, a new simplified hypothesis\n  `hᵢ` is introduced, but the old one remains in the local context.\n- `simp at *` simplifies all the hypotheses and the target.\n- `simp [*] at *` simplifies target and all (propositional) hypotheses using the\n  other hypotheses.\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 358.6915907972441, "y": 284.3154133858268, "kind": "lean-hover", "role": "state", "tooltip": "No goals", "width": 7.5, "height": 4.200000000000001}, {"page": 3, "x": 63.023622047244096, "y": 343.09541338582676, "kind": "lean-hover", "role": "token", "tooltip": "`#eval e` evaluates the expression `e` by compiling it and running the compiled code. It then\nprints the resulting value.\n\n* The command attempts to use `ToExpr`, `Repr`, or `ToString` instances to print the result.\n* If `e` is a monadic value of type `m ty`, then the command tries to adapt the monad `m`\n  to one of the monads that `#eval` supports, which include `IO`, `CoreM`, `MetaM`, `TermElabM`, and `CommandElabM`.\n  Users can define `MonadEval` instances to extend the list of supported monads.\n\nThe `#eval` command gracefully degrades in capability depending on what is imported.\nImporting the `Lean.Elab.Command` module provides full capabilities.\n\nDue to unsoundness, `#eval` refuses to evaluate expressions that depend on `sorry`, even indirectly,\nsince the presence of `sorry` can lead to runtime instability and crashes.\nThis check can be overridden with the `#eval! e` command.\n\nOptions:\n* If `eval.pp` is true (default: true) then tries to use `ToExpr` instances to make use of the\n  usual pretty printer. Otherwise, only tries using `Repr` and `ToString` instances.\n* If `eval.type` is true (default: false) then pretty prints the type of the evaluated value.\n* If `eval.derive.repr` is true (default: true) then attempts to auto-derive a `Repr` instance\n  when there is no other way to print the result.\n\nSee also: `#reduce e` for evaluation by term reduction.\n", "width": 24.08203125, "height": 6.078125}, {"page": 3, "x": 96.73846579724409, "y": 343.09541338582676, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 106.37127829724409, "y": 343.09541338582676, "kind": "lean-hover", "role": "token", "tooltip": "`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 116.00409079724409, "y": 343.09541338582676, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 120.82049704724409, "y": 343.09541338582676, "kind": "lean-hover", "role": "token", "tooltip": "Tuple notation; `()` is short for `Unit.unit`, `(a, b, c)` for `Prod.mk a (Prod.mk b c)`, etc. \n\nConventions for notations in identifiers:\n\n * "use strict";
const leanTooltips = (() => {
  const tooltip = document.getElementById("tooltip");
  let pinned = false, active = null, activeRegion = null, hoveringTooltip = false, hideTimer = null;
  function cancelHide() {
    clearTimeout(hideTimer);
    hideTimer = null;
  }
  function hideSoon() {
    if (pinned) return;
    cancelHide();
    hideTimer = setTimeout(() => {
      if (!pinned && !hoveringTooltip && !tooltip.matches(":focus-within")) close();
    }, 200);
  }
  function close() {
    cancelHide();
    pinned = false;
    hoveringTooltip = false;
    tooltip.hidden = true;
    if (active) {
      active.classList.remove("active");
      active.removeAttribute("aria-describedby");
    }
    active = null;
    activeRegion = null;
  }
  function show(button, region) {
    if (pinned) return;
    if (active === button) cancelHide();
    else close();
    active = button;
    activeRegion = region;
    button.classList.add("active");
    button.setAttribute("aria-describedby", "tooltip");
    tooltip.textContent = region.tooltip;
    tooltip.dataset.pinned = "false";
    tooltip.style.maxHeight = "";
    tooltip.style.left = "12px";
    tooltip.style.top = "12px";
    tooltip.hidden = false;
    const rect = button.getBoundingClientRect();
    const width = tooltip.offsetWidth, height = tooltip.offsetHeight;
    tooltip.style.left = Math.max(12, Math.min(rect.left, innerWidth - width - 12)) + "px";
    const below = rect.bottom + 10;
    const belowSpace = innerHeight - below - 12;
    const aboveSpace = rect.top - 22;
    const useBelow = belowSpace >= Math.min(height, 80) || belowSpace >= aboveSpace;
    const available = Math.max(0, useBelow ? belowSpace : aboveSpace);
    const fittedHeight = Math.min(height, available);
    tooltip.style.maxHeight = fittedHeight + "px";
    // Read the final height after limiting it, including padding and borders.
    // Clamping an above-text popup to the viewport top can cover its trigger.
    tooltip.style.top = (useBelow ? below : rect.top - tooltip.offsetHeight - 10) + "px";
  }
  function mount(container, page) {
    container.innerHTML = page.svg;
    for (const region of page.regions) {
      const button = document.createElement("button");
      button.className = "hover";
      button.dataset.role = region.role;
      button.setAttribute("aria-label", region.role === "state" ? "Proof state: " + region.tooltip : region.tooltip);
      button.style.left = (100 * region.x / page.width) + "%";
      button.style.top = (100 * region.y / page.height) + "%";
      button.style.width = (100 * region.width / page.width) + "%";
      button.style.height = (100 * region.height / page.height) + "%";
      button.addEventListener("pointerenter", () => show(button, region));
      button.addEventListener("pointerleave", hideSoon);
      button.addEventListener("focus", () => show(button, region));
      button.addEventListener("blur", hideSoon);
      button.addEventListener("click", event => {
        event.stopPropagation();
        if (pinned && active === button) { close(); return; }
        close();
        show(button, region);
        pinned = true;
        tooltip.dataset.pinned = "true";
      });
      container.append(button);
    }
  }
  tooltip.tabIndex = 0;
  tooltip.addEventListener("pointerenter", () => { hoveringTooltip = true; cancelHide(); });
  tooltip.addEventListener("pointerleave", () => { hoveringTooltip = false; hideSoon(); });
  tooltip.addEventListener("focus", cancelHide);
  tooltip.addEventListener("blur", hideSoon);
  tooltip.addEventListener("wheel", event => {
    if (event.ctrlKey || !event.deltaY || tooltip.scrollHeight <= tooltip.clientHeight) return;
    // Keep docstring scrolling inside the popup, even in a scrolling reader.
    const unit = event.deltaMode === 1 ? parseFloat(getComputedStyle(tooltip).lineHeight)
      : event.deltaMode === 2 ? tooltip.clientHeight : 1;
    event.preventDefault();
    hoveringTooltip = true;
    cancelHide();
    tooltip.scrollTop += event.deltaY * unit;
  }, {passive: false});
  addEventListener("keydown", event => { if (event.key === "Escape") close(); });
  addEventListener("click", event => { if (!tooltip.contains(event.target)) close(); });
  addEventListener("resize", close);
  addEventListener("scroll", () => {
    if (pinned || hoveringTooltip || tooltip.matches(":focus-within")) return;
    if (active && active.matches(":hover")) show(active, activeRegion);
    else close();
  }, {passive: true});
  return {close, mount};
})();

"use strict";
const pages = JSON.parse(document.getElementById("document-data").textContent);
const container = document.getElementById("pages");
const contents = document.getElementById("table-of-contents");
const headings = [];
for (const [index, page] of pages.entries()) {
  const section = document.createElement("section");
  section.className = "page";
  section.id = "page-" + (index + 1);
  section.setAttribute("aria-label", "Blog content");
  section.style.aspectRatio = String(page.width / page.height);
  leanTooltips.mount(section, page);
  container.append(section);
  for (const heading of page.headings || []) {
    const anchor = document.createElement("span");
    anchor.id = heading.id;
    anchor.className = "heading-anchor";
    anchor.style.position = "absolute";
    anchor.style.top = (100 * heading.y / page.height) + "%";
    anchor.style.left = "0";
    anchor.style.scrollMarginTop = "24px";
    anchor.setAttribute("aria-hidden", "true");
    section.append(anchor);
    headings.push(heading);
  }
}
if (contents) {
  const posts = headings.filter(heading => heading.level === 1);
  for (const post of posts) {
    const item = document.createElement("li");
    const link = document.createElement("a");
    link.href = "#" + post.id;
    link.textContent = post.title;
    item.append(link);
    contents.append(item);
  }
  contents.closest("nav").hidden = !posts.length;
}
// Pages are created dynamically, so resolve a saved fragment after mounting them.
const target = document.getElementById(location.hash.slice(1));
if (target) target.scrollIntoView();
