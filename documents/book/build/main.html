03125, "height": 6.078125}, {"page": 3, "x": 120.82049704724409, "y": 153.10291338582678, "kind": "lean-hover", "role": "token", "tooltip": "String : Type\n\nA string is a sequence of Unicode scalar values.\n\nAt runtime, strings are represented by [dynamic arrays](https://en.wikipedia.org/wiki/Dynamic_array)\nof bytes using the UTF-8 encoding. Both the size in bytes (`String.utf8ByteSize`) and in characters\n(`String.length`) are cached and take constant time. Many operations on strings perform in-place\nmodifications when the reference to the string is unique.\n", "width": 28.8984375, "height": 6.078125}, {"page": 3, "x": 101.55487204724409, "y": 263.3110383858268, "kind": "lean-hover", "role": "token", "tooltip": "Demo.identity_pair (p q : Prop) : (p → p) ∧ (q → q)\n\nA multiline proof with two branches and interactive proof states. ", "width": 62.61328125, "height": 6.078125}, {"page": 3, "x": 168.9845595472441, "y": 263.3110383858268, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 173.8009657972441, "y": 263.3110383858268, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 183.4337782972441, "y": 263.3110383858268, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 193.0665907972441, "y": 263.3110383858268, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 202.6994032972441, "y": 263.3110383858268, "kind": "lean-hover", "role": "token", "tooltip": "The universe of propositions. `Prop ≡ Sort 0`.\n\nEvery proposition is propositionally equal to either `True` or `False`. ", "width": 19.265625, "height": 6.078125}, {"page": 3, "x": 221.9650282972441, "y": 263.3110383858268, "kind": "lean-hover", "role": "token", "tooltip": "Explicit binder, like `(x y : A)` or `(x y)`.\nDefault values can be specified using `(x : A := v)` syntax, and tactics using `(x : A := by tac)`.\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 87.10565329724409, "y": 274.3891633858268, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 106.37127829724409, "y": 274.3891633858268, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 111.18768454724409, "y": 274.3891633858268, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 120.82049704724409, "y": 274.3891633858268, "kind": "lean-hover", "role": "token", "tooltip": "`And a b`, or `a ∧ b`, is the conjunction of propositions. It can be\nconstructed and destructed like a pair: if `ha : a` and `hb : b` then\n`⟨ha, hb⟩ : a ∧ b`, and if `h : a ∧ b` then `h.left : a` and `h.right : b`.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `∧` in identifiers is `and`.", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 135.2697157972441, "y": 274.3891633858268, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 154.5353407972441, "y": 274.3891633858268, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 159.3517470472441, "y": 274.3891633858268, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 183.4337782972441, "y": 274.3891633858268, "kind": "lean-hover", "role": "token", "tooltip": "`by tac` constructs a term of the expected type by running the tactic(s) `tac`. ", "width": 9.6328125, "height": 6.078125}, {"page": 3, "x": 195.0665907972441, "y": 276.26728838582676, "kind": "lean-hover", "role": "state", "tooltip": "p : Prop\nq : Prop\n⊢ (p → p) ∧ (q → q)", "width": 7.5, "height": 4.200000000000001}, {"page": 3, "x": 72.65643454724409, "y": 285.4672883858268, "kind": "lean-hover", "role": "token", "tooltip": "If the main goal's target type is an inductive type, `constructor` solves it with\nthe first matching constructor, or else fails.\n\nIf more than one constructor matches, `constructor` still uses the first one, but it issues a\nwarning. Use `constructor!`, which is short for `constructor +first`, to select the first matching\nconstructor without a warning. To choose a specific constructor of a two-constructor inductive type,\nuse `left` or `right`.\n", "width": 52.98046875, "height": 6.078125}, {"page": 3, "x": 127.63690329724409, "y": 287.34541338582676, "kind": "lean-hover", "role": "state", "tooltip": "case left\np : Prop\nq : Prop\n⊢ p → p\n\ncase right\np : Prop\nq : Prop\n⊢ q → q", "width": 7.5, "height": 4.200000000000001}, {"page": 3, "x": 72.65643454724409, "y": 296.5454133858268, "kind": "lean-hover", "role": "token", "tooltip": "`all_goals tac` runs `tac` on each goal, concatenating the resulting goals.\nIf the tactic fails on any goal, the entire `all_goals` tactic fails.\n\nSee also `any_goals tac`.\n", "width": 43.34765625, "height": 6.078125}, {"page": 3, "x": 118.00409079724409, "y": 298.42353838582676, "kind": "lean-hover", "role": "state", "tooltip": "case left\np : Prop\nq : Prop\n⊢ p → p\n\ncase right\np : Prop\nq : Prop\n⊢ q → q", "width": 7.5, "height": 4.200000000000001}, {"page": 3, "x": 82.28924704724409, "y": 307.6235383858268, "kind": "lean-hover", "role": "token", "tooltip": "Introduces one or more hypotheses, optionally naming and/or pattern-matching them.\nFor each hypothesis to be introduced, the remaining main goal's target type must\nbe a `let` or function type.\n\n* `intro` by itself introduces one anonymous hypothesis, which can be accessed\n  by e.g. `assumption`. It is equivalent to `intro _`.\n* `intro x y` introduces two hypotheses and names them. Individual hypotheses\n  can be anonymized via `_`, given a type ascription, or matched against a pattern:\n  ```lean\n  -- ... ⊢ α × β → ...\n  intro (a, b)\n  -- ..., a : α, b : β ⊢ ...\n  ```\n* `intro rfl` is short for `intro h; subst h`, if `h` is an equality where the left-hand or right-hand side\n  is a variable.\n* Alternatively, `intro` can be combined with pattern matching much like `fun`:\n  ```lean\n  intro\n  | n + 1, 0 => tac\n  | ...\n  ```\n", "width": 24.08203125, "height": 6.078125}, {"page": 3, "x": 111.18768454724409, "y": 307.6235383858268, "kind": "lean-hover", "role": "token", "tooltip": "p", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 118.00409079724409, "y": 309.50166338582676, "kind": "lean-hover", "role": "state", "tooltip": "case left\np : Prop\nq : Prop\nh : p\n⊢ p\n\ncase right\np : Prop\nq : Prop\nh : q\n⊢ q", "width": 7.5, "height": 4.200000000000001}, {"page": 3, "x": 82.28924704724409, "y": 318.7016633858268, "kind": "lean-hover", "role": "token", "tooltip": "`exact e` closes the main goal if its target type matches that of `e`.\n", "width": 24.08203125, "height": 6.078125}, {"page": 3, "x": 111.18768454724409, "y": 318.7016633858268, "kind": "lean-hover", "role": "token", "tooltip": "p", "width": 4.81640625, "height": 6.078125}, {"page": 3, "x": 118.00409079724409, "y": 320.57978838582676, "kind": "lean-hover", "role": "state", "tooltip": "No goals", "width": 7.5, "height": 4.200000000000001}], "headings": [{"level": 1, "title": "1 From definitions to proofs", "page": 3, "y": 56.69291338582677, "id": "heading-1"}, {"level": 2, "title": "1.1 A first definition", "page": 3, "y": 107.28291338582677, "id": "heading-2"}, {"level": 2, "title": "1.2 A proof with two branches", "page": 3, "y": 204.16103838582677, "id": "heading-3"}]}, {"svg": "\u003csvg viewBox=\"0 0 498.897637795 708.661417323\" width=\"498.897637795pt\" height=\"708.661417323pt\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xmlns:h5=\"http://www.w3.org/1999/xhtml\">\u003cpath fill=\"#ffffff\" fill-rule=\"nonzero\" d=\"M 0 0v 708.661417323h 498.897637795v -708.661417323Z \"/>\u003cg transform=\"translate(51.023622047 56.692913386)\">\u003cg transform=\"matrix(1 0 0 -1 0 9.03)\">\u003cuse xlink:href=\"#gF796984EE00DCE7FBB6A98449ADAAA66\" x=\"0\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003c/g>\u003cg transform=\"matrix(1 0 0 -1 11.396 9.03)\">\u003cuse xlink:href=\"#g422DBA69A031739D7AA34CE70E225DD2\" x=\"0\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#gE5FD10D3FF7EA9BB0202ECB413CE08E3\" x=\"10.024\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#g31D840B6B63A7EE7E70CA68EFA5F5064\" x=\"16.87\" y=\"0\" fill=\"#000000\" fill-rule=\"nonzero\"/>\u003cuse xlink:href=\"#g8311E5CB6115D6097309 erridden with the `#eval! e` command.\n\nOptions:\n* If `eval.pp` is true (default: true) then tries to use `ToExpr` instances to make use of the\n  usual pretty printer. Otherwise, only tries using `Repr` and `ToString` instances.\n* If `eval.type` is true (default: false) then pretty prints the type of the evaluated value.\n* If `eval.derive.repr` is true (default: true) then attempts to auto-derive a `Repr` instance\n  when there is no other way to print the result.\n\nSee also: `#reduce e` for evaluation by term reduction.\n", "width": 24.08203125, "height": 6.078125}, {"page": 4, "x": 96.73846579724409, "y": 411.26228838582676, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 4, "x": 106.37127829724409, "y": 411.26228838582676, "kind": "lean-hover", "role": "token", "tooltip": "`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 4.81640625, "height": 6.078125}, {"page": 4, "x": 116.00409079724409, "y": 411.26228838582676, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 4.81640625, "height": 6.078125}, {"page": 4, "x": 120.82049704724409, "y": 411.26228838582676, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 4.81640625, "height": 6.078125}, {"page": 4, "x": 96.73846579724409, "y": 538.218538385827, "kind": "lean-hover", "role": "token", "tooltip": "SimpleGraph.{u} (V : Type u) : Type u\n\nA simple graph is an irreflexive symmetric relation `Adj` on a vertex type `V`.\nThe relation describes which pairs of vertices are adjacent.\nThere is exactly one edge for every pair of adjacent vertices;\nsee `SimpleGraph.edgeSet` for the corresponding edge set.\n", "width": 52.98046875, "height": 6.078125}, {"page": 4, "x": 191.0665907972441, "y": 570.296663385827, "kind": "lean-hover", "role": "token", "tooltip": "Type u", "width": 4.81640625, "height": 6.078125}, {"page": 4, "x": 210.3322157972441, "y": 570.296663385827, "kind": "lean-hover", "role": "token", "tooltip": "A type universe. `Type ≡ Type 0`, `Type u ≡ Sort (u + 1)`. ", "width": 28.8984375, "height": 6.078125}, {"page": 4, "x": 258.4962782972441, "y": 570.296663385827, "kind": "lean-hover", "role": "token", "tooltip": "A type universe. `Type ≡ Type 0`, `Type u ≡ Sort (u + 1)`. ", "width": 28.8984375, "height": 6.078125}, {"page": 4, "x": 70.65643454724409, "y": 603.531038385827, "kind": "lean-hover", "role": "token", "tooltip": "SimpleGraph.Adj.{u} {V : Type u} (self : SimpleGraph V) : V → V → Prop\n\nThe adjacency relation of a simple graph. ", "width": 72.24609375, "height": 6.078125}, {"page": 4, "x": 157.3517470472441, "y": 603.531038385827, "kind": "lean-hover", "role": "token", "tooltip": "Type u", "width": 4.81640625, "height": 6.078125}, {"page": 4, "x": 176.6173720472441, "y": 603.531038385827, "kind": "lean-hover", "role": "token", "tooltip": "Type u", "width": 4.81640625, "height": 6.078125}, {"page": 4, "x": 195.8829970472441, "y": 603.531038385827, "kind": "lean-hover", "role": "token", "tooltip": "The universe of propositions. `Prop ≡ Sort 0`.\n\nEvery proposition is propositionally equal to either `True` or `False`. ", "width": 19.265625, "height": 6.078125}, {"page": 4, "x": 70.65643454724409, "y": 614.609163385827, "kind": "lean-hover", "role": "token", "tooltip": "SimpleGraph.symm.{u} {V : Type u} (self : SimpleGraph V) : Std.Symm self.Adj",     const width = tooltip.offsetWidth, height = tooltip.offsetHeight;
    tooltip.style.left = Math.max(12, Math.min(rect.left, innerWidth - width - 12)) + "px";
    const below = rect.bottom + 10;
    const belowSpace = innerHeight - below - 12;
    const aboveSpace = rect.top - 22;
    const useBelow = belowSpace >= Math.min(height, 80) || belowSpace >= aboveSpace;
    const available = Math.max(0, useBelow ? belowSpace : aboveSpace);
    const fittedHeight = Math.min(height, available);
    tooltip.style.maxHeight = fittedHeight + "px";
    // Read the final height after limiting it, including padding and borders.
    // Clamping an above-text popup to the viewport top can cover its trigger.
    tooltip.style.top = (useBelow ? below : rect.top - tooltip.offsetHeight - 10) + "px";
  }
  function mount(container, page) {
    container.innerHTML = page.svg;
    for (const region of page.regions) {
      const button = document.createElement("button");
      button.className = "hover";
      button.dataset.role = region.role;
      button.setAttribute("aria-label", region.role === "state" ? "Proof state: " + region.tooltip : region.tooltip);
      button.style.left = (100 * region.x / page.width) + "%";
      button.style.top = (100 * region.y / page.height) + "%";
      button.style.width = (100 * region.width / page.width) + "%";
      button.style.height = (100 * region.height / page.height) + "%";
      button.addEventListener("pointerenter", () => show(button, region));
      button.addEventListener("pointerleave", hideSoon);
      button.addEventListener("focus", () => show(button, region));
      button.addEventListener("blur", hideSoon);
      button.addEventListener("click", event => {
        event.stopPropagation();
        if (pinned && active === button) { close(); return; }
        close();
        show(button, region);
        pinned = true;
        tooltip.dataset.pinned = "true";
      });
      container.append(button);
    }
  }
  tooltip.tabIndex = 0;
  tooltip.addEventListener("pointerenter", () => { hoveringTooltip = true; cancelHide(); });
  tooltip.addEventListener("pointerleave", () => { hoveringTooltip = false; hideSoon(); });
  tooltip.addEventListener("focus", cancelHide);
  tooltip.addEventListener("blur", hideSoon);
  tooltip.addEventListener("wheel", event => {
    if (event.ctrlKey || !event.deltaY || tooltip.scrollHeight <= tooltip.clientHeight) return;
    // Keep docstring scrolling inside the popup, even in a scrolling reader.
    const unit = event.deltaMode === 1 ? parseFloat(getComputedStyle(tooltip).lineHeight)
      : event.deltaMode === 2 ? tooltip.clientHeight : 1;
    event.preventDefault();
    hoveringTooltip = true;
    cancelHide();
    tooltip.scrollTop += event.deltaY * unit;
  }, {passive: false});
  addEventListener("keydown", event => { if (event.key === "Escape") close(); });
  addEventListener("click", event => { if (!tooltip.contains(event.target)) close(); });
  addEventListener("resize", close);
  addEventListener("scroll", () => {
    if (pinned || hoveringTooltip || tooltip.matches(":focus-within")) return;
    if (active && active.matches(":hover")) show(active, activeRegion);
    else close();
  }, {passive: true});
  return {close, mount};
})();
</script>
  <script>"use strict";
const pages = JSON.parse(document.getElementById("document-data").textContent);
const container = document.getElementById("pages");
const contents = document.getElementById("table-of-contents");
const headings = [];
for (const [index, page] of pages.entries()) {
  const section = document.createElement("section");
  section.className = "page";
  section.id = "page-" + (index + 1);
  section.setAttribute("aria-label", "Page " + (index + 1));
  section.style.aspectRatio = String(page.width / page.height);
  leanTooltips.mount(section, page);
  container.append(section);
  for (const heading of page.headings || []) {
    const anchor = document.createElement("span");
    anchor.id = heading.id;
    anchor.className = "heading-anchor";
    anchor.style.position = "absolute";
    anchor.style.top = (100 * heading.y / page.height) + "%";
    anchor.style.left = "0";
    anchor.style.scrollMarginTop = "24px";
    anchor.setAttribute("aria-hidden", "true");
    section.append(anchor);
    headings.push(heading);
  }
}
if (contents) {
  const parents = [];
  for (const heading of headings) {
    while (parents.length && parents[parents.length - 1].level >= heading.level) parents.pop();
    let list = contents;
    if (parents.length) {
      const parent = parents[parents.length - 1].item;
      list = parent.querySelector(":scope > ol");
      if (!list) { list = document.createElement("ol"); parent.append(list); }
    }
    const item = document.createElement("li");
    const link = document.createElement("a");
    link.href = "#" + heading.id;
    link.textContent = heading.title;
    item.append(link);
    list.append(item);
    parents.push({level: heading.level, item});
  }
  contents.closest("nav").hidden = !headings.length;
}
document.getElementById("page-count").textContent = pages.length + (pages.length === 1 ? " page" : " pages");
// Pages are created dynamically, so resolve a saved fragment after mounting them.
const target = document.getElementById(location.hash.slice(1));
if (target) target.scrollIntoView();
</script>
