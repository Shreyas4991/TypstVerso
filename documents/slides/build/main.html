horthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 9.6328125, "height": 12.15625}, {"page": 2, "x": 167.59375, "y": 119.63624999999999, "kind": "lean-hover", "role": "token", "tooltip": "`And a b`, or `a ∧ b`, is the conjunction of propositions. It can be\nconstructed and destructed like a pair: if `ha : a` and `hb : b` then\n`⟨ha, hb⟩ : a ∧ b`, and if `h : a ∧ b` then `h.left : a` and `h.right : b`.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `∧` in identifiers is `and`.", "width": 9.6328125, "height": 12.15625}, {"page": 2, "x": 196.4921875, "y": 119.63624999999999, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 9.6328125, "height": 12.15625}, {"page": 2, "x": 235.0234375, "y": 119.63624999999999, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 9.6328125, "height": 12.15625}, {"page": 2, "x": 244.65625, "y": 119.63624999999999, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 9.6328125, "height": 12.15625}, {"page": 2, "x": 292.8203125, "y": 119.63624999999999, "kind": "lean-hover", "role": "token", "tooltip": "`by tac` constructs a term of the expected type by running the tactic(s) `tac`. ", "width": 19.265625, "height": 12.15625}, {"page": 2, "x": 316.0859375, "y": 123.3925, "kind": "lean-hover", "role": "state", "tooltip": "p : Prop\nq : Prop\n⊢ (p → p) ∧ (q → q)", "width": 15.0, "height": 8.400000000000002}, {"page": 2, "x": 71.265625, "y": 141.7925, "kind": "lean-hover", "role": "token", "tooltip": "If the main goal's target type is an inductive type, `constructor` solves it with\nthe first matching constructor, or else fails.\n\nIf more than one constructor matches, `constructor` still uses the first one, but it issues a\nwarning. Use `constructor!`, which is short for `constructor +first`, to select the first matching\nconstructor without a warning. To choose a specific constructor of a two-constructor inductive type,\nuse `left` or `right`.\n", "width": 105.9609375, "height": 12.15625}, {"page": 2, "x": 181.2265625, "y": 145.54875, "kind": "lean-hover", "role": "state", "tooltip": "case left\np : Prop\nq : Prop\n⊢ p → p\n\ncase right\np : Prop\nq : Prop\n⊢ q → q", "width": 15.0, "height": 8.400000000000002}, {"page": 2, "x": 71.265625, "y": 163.94875, "kind": "lean-hover", "role": "token", "tooltip": "`all_goals tac` runs `tac` on each goal, concatenating the resulting goals.\nIf the tactic fails on any goal, the entire `all_goals` tactic fails.\n\nSee also `any_goals tac`.\n", "width": 86.6953125, "height": 12.15625}, {"page": 2, "x": 161.9609375, "y": 167.705, "kind": "lean-hover", "role": "state", "tooltip": "case left\np : Prop\nq : Prop\n⊢ p → p\n\ncase right\np : Prop\nq : Prop\n⊢ q → q", "width": 15.0, "height": 8.400000000000002}, {"page": 2, "x": 90.53125, "y": 186.105, "kind": "lean-hover", "role": "token", "tooltip": "Introduces one or more hypotheses, optionally naming and/or pattern-matching them.\nFor each hypothesis to be introduced, the remaining main goal's target type must\nbe a `let` or function type.\n\n* `intro` by itself introduces one anonymous hypothesis, which can be accessed\n  by e.g. `assumption`. It is equivalent to `intro _`.\n* `intro x y` introduces two hypotheses and names them. Individual hypotheses\n  can be anonymized via `_`, given a type ascription, or matched against a pattern:\n  ```lean\n  -- ... ⊢ α × β → ...\n  intro (a, b)\n  -- ..., a : α, b : β ⊢ ...\n  ```\n* `intro rfl` is short for `intro h; subst h`, if `h` is an equality where the left-hand or right-hand side\n  is a variable.\n* Alternatively, `intro` can be combined with pattern matching much like `fun`:\n  ```lean\n  intro\n  | n + 1, 0 => tac\n  | ...\n  ```\n", "width": 48.1640625, "height": 12.15625}, {"page": 2, "x": 148.328125, "y": 186.105, "kind": "lean-hover", "role": "token", "tooltip": "p", "width": 9.6328125, "height": 12.15625}, {"page": 2, "x": 161.9609375, "y": 189.86125, "kind": "lean-hover", "role": "state", "tooltip": "case left\np : Prop\nq : Prop\nh : p\n⊢ p\n\ncase right\np : Prop\nq : Prop\nh : q\n⊢ q", "width": 15.0, "height": 8.400000000000002}, {"page": 2, "x": 90.53125, "y": 208.26125, "kind": "lean-hover", "role": "token", "tooltip": "`exact e` closes the main goal if its target type matches that of `e`.\n", "width": 48.1640625, "height": 12.15625}, {"page": 2, "x": 148.328125, "y": 208.26125, "kind": "lean-hover", "role": "token", "tooltip": "p", "width": 9.6328125, "height": 12.15625}, {"page": 2, "x": 161.9609375, "y": 212.0175, "kind": "lean-hover", "role": "state", "tooltip": "No goals", "width": 15.0, "height": 8.400000000000002}], "headings": [{"level": 2, "title": "A multiline proof", "page": 2, "y": 40.0, "id": "heading-2"}]}, {"svg": "\u003csvg viewBox=\"0 0 841.88976378 473.562992126\" width=\"841.88976378pt\" height=\"473.562992126pt\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xmlns:h5=\"http://www.w3.org/1999/xhtml\">\u003cpath fill=\"#ffffff\" fill-rule=\"nonzero\" d=\"M 0 0v 473.562992126h 841.88976378v -473.562992126Z \"/>\u003cg transform=\"translate(40 40)\">\u003cg transform=\"matrix(1 0 0 -1 0 15.48)\">\u003cuse xlink:href=\"#g36AEE8821E1CE28CC40AC1B92580D0ED\" x=\"0\" y=\"0\" f 44q 0.138 0.114 0.138 0.39v 1.104h -2.448q -0.264 0 -0.354 0.186q -0.09 0.186 -0.114 0.318q 0.408 0.648 0.858 1.314q 0.45 0.666 0.894 1.29q 0.444 0.624 0.828 1.146q 0.384 0.522 0.672 0.87q 0.036 0.036 0.084 0.084q 0.048 0.048 0.108 0.048h 0.384l 0.024 -0.024q -0.012 -0.072 -0.018 -0.39q -0.006 -0.318 -0.006 -0.774v -3.504h 0.996Z m -1.908 3.456q -0.624 -0.852 -1.23 -1.782q -0.606 -0.93 -1.062 -1.674h 2.292v 3.456Z \"/>\u003c/symbol>\u003csymbol id=\"g324DB118FBD3DB1F139A1029AEB53169\" overflow=\"visible\">\u003cpath d=\"M 0 0m 3.516 7.752l -2.844 -8.46h -0.492l 2.844 8.46h 0.492Z \"/>\u003c/symbol>\u003c/defs>\u003c/svg>", "width": 841.88976378, "height": 473.562992126, "regions": [{"page": 4, "x": 119.4296875, "y": 97.47999999999999, "kind": "lean-hover", "role": "token", "tooltip": "Demo.identity_pair (p q : Prop) : (p → p) ∧ (q → q)\n\nA multiline proof with two branches and interactive proof states. ", "width": 173.390625, "height": 12.15625}, {"page": 4, "x": 242.65625, "y": 139.63625, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 9.6328125, "height": 12.15625}, {"page": 4, "x": 261.921875, "y": 139.63625, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 9.6328125, "height": 12.15625}, {"page": 4, "x": 300.453125, "y": 139.63625, "kind": "lean-hover", "role": "token", "tooltip": "The universe of propositions. `Prop ≡ Sort 0`.\n\nEvery proposition is propositionally equal to either `True` or `False`. ", "width": 38.53125, "height": 12.15625}, {"page": 4, "x": 387.1484375, "y": 139.63625, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 9.6328125, "height": 12.15625}, {"page": 4, "x": 425.6796875, "y": 139.63625, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 9.6328125, "height": 12.15625}, {"page": 4, "x": 483.4765625, "y": 139.63625, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 9.6328125, "height": 12.15625}, {"page": 4, "x": 522.0078125, "y": 139.63625, "kind": "lean-hover", "role": "token", "tooltip": "Prop", "width": 9.6328125, "height": 12.15625}, {"page": 4, "x": 52.0, "y": 197.7925, "kind": "lean-hover", "role": "token", "tooltip": "`#eval e` evaluates the expression `e` by compiling it and running the compiled code. It then\nprints the resulting value.\n\n* The command attempts to use `ToExpr`, `Repr`, or `ToString` instances to print the result.\n* If `e` is a monadic value of type `m ty`, then the command tries to adapt the monad `m`\n  to one of the monads that `#eval` supports, which include `IO`, `CoreM`, `MetaM`, `TermElabM`, and `CommandElabM`.\n  Users can define `MonadEval` instances to extend the list of supported monads.\n\nThe `#eval` command gracefully degrades in capability depending on what is imported.\nImporting the `Lean.Elab.Command` module provides full capabilities.\n\nDue to unsoundness, `#eval` refuses to evaluate expressions that depend on `sorry`, even indirectly,\nsince the presence of `sorry` can lead to runtime instability and crashes.\nThis check can be overridden with the `#eval! e` command.\n\nOptions:\n* If `eval.pp` is true (default: true) then tries to use `ToExpr` instances to make use of the\n  usual pretty printer. Otherwise, only tries using `Repr` and `ToString` instances.\n* If `eval.type` is true (default: false) then pretty prints the type of the evaluated value.\n* If `eval.derive.repr` is true (default: true) then attempts to auto-derive a `Repr` instance\n  when there is no other way to print the result.\n\nSee also: `#reduce e` for evaluation by term reduction.\n", "width": 48.1640625, "height": 12.15625}, {"page": 4, "x": 119.4296875, "y": 197.7925, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 9.6328125, "height": 12.15625}, {"page": 4, "x": 138.6953125, "y": 197.7925, "kind": "lean-hover", "role": "token", "tooltip": "`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.", "width": 9.6328125, "height": 12.15625}, {"page": 4, "x": 157.9609375, "y": 197.7925, "kind": "lean-hover", "role": "token", "tooltip": "ℕ", "width": 9.6328125, "height": 12.15625}, {"page": 4, "x": 167.59375, "y": 197.7925, "kind": "lean-hover", "role": "token", "tooltip": "Parentheses, used for grouping expressions (e.g., `a * (b + c)`).\nCan also be used for creating simple functions when combined with `·`. Here are some examples:\n  - `(· + 1)` is shorthand for `fun x => x + 1`\n  - `(· + ·)` is shorthand for `fun x y => x + y`\n  - `(f · a b)` is shorthand for `fun x => f x a b`\n  - `(h (· + 1) ·)` is shorthand for `fun x => h (fun y => y + 1) x`\n  - also applies to other parentheses-like notations such as `(·, 1)` and `(· : Nat → Nat)`\n", "width": 9.6328125, "height": 12.15625}], "headings": [{"level": 2, "title": "A Lean command", "page": 4, "y": 40.0, "id": "heading-4"}]}]</script>
<script>"use strict";
const leanTooltips = (() => {
  const tooltip = document.getElementById("tooltip");
  let pinned = false, active = null, activeRegion = null, hoveringTooltip = false, hideTimer = null;
  function cancelHide() {
    clearTimeout(hideTimer);
    hideTimer = null;
  }
  function hideSoon() {
    if (pinned) return;
    cancelHide();
    hideTimer = setTimeout(() => {
      if (!pinned && !hoveringTooltip && !tooltip.matches(":focus-within")) close();
    }, 200);
  }
  function close() {
    cancelHide();
    pinned = false;
    hoveringTooltip = false;
    tooltip.hidden = true;
    if (active) {
      active.classList.remove("active");
      active.removeAttribute("aria-describedby");
    }
    active = null;
    activeRegion = null;
  }
  function show(button, region) {
    if (pinned) return;
    if (active === button) cancelHide();
    else close();
    active = button;
    activeRegion = region;
    button.classList.add("active");
    button.setAttribute("aria-describedby", "tooltip");
    tooltip.textContent = region.tooltip;
    tooltip.dataset.pinned = "false";
    tooltip.style.maxHeight = "";
    tooltip.style.left = "12px";
    tooltip.style.top = "12px";
    tooltip.hidden = false;
    const rect = button.getBoundingClientRect();
    const width = tooltip.offsetWidth, height = tooltip.offsetHeight;
    tooltip.style.left = Math.max(12, Math.min(rect.left, innerWidth - width - 12)) + "px";
    const below = rect.bottom + 10;
    const belowSpace = innerHeight - below - 12;
    const aboveSpace = rect.top - 22;
    const useBelow = belowSpace >= Math.min(height, 80) || belowSpace >= aboveSpace;
    const available = Math.max(0, useBelow ? belowSpace : aboveSpace);
    const fittedHeight = Math.min(height, available);
    tooltip.style.maxHeight = fittedHeight + "px";
    // Read the final height after limiting it, including padding and borders.
    // Clamping an above-text popup to the viewport top can cover its trigger.
    tooltip.style.top = (useBelow ? below : rect.top - tooltip.offsetHeight - 10) + "px";
  }
  function mount(container, page) {
    container.innerHTML = page.svg;
    for (const region of page.regions) {
      const button = document.createElement("button");
      button.className = "hover";
      button.dataset.role = region.role;
      button.setAttribute("aria-label", region.role === "state" ? "Proof state: " + region.tooltip : region.tooltip);
      button.style.left = (100 * region.x / page.width) + "%";
      button.style.top = (100 * region.y / page.height) + "%";
      button.style.width = (100 * region.width / page.width) + "%";
      button.style.height = (100 * region.height / page.height) + "%";
      button.addEventListener("pointerenter", () => show(button, region));
      button.addEventListener("pointerleave", hideSoon);
      button.addEventListener("focus", () => show(button, region));
      button.addEventListener("blur", hideSoon);
      button.addEventListener("click", event => {
        event.stopPropagation();
        if (pinned && active === button) { close(); return; }
        close();
        show(button, region);
        pinned = true;
        tooltip.dataset.pinned = "true";
      });
      container.append(button);
    }
  }
  tooltip.tabIndex = 0;
  tooltip.addEventListener("pointerenter", () => { hoveringTooltip = true; cancelHide(); });
  tooltip.addEventListener("pointerleave", () => { hoveringTooltip = false; hideSoon(); });
  tooltip.addEventListener("focus", cancelHide);
  tooltip.addEventListener("blur", hideSoon);
  tooltip.addEventListener("wheel", event => {
    if (event.ctrlKey || !event.deltaY || tooltip.scrollHeight <= tooltip.clientHeight) return;
    // Keep docstring scrolling inside the popup, even in a scrolling reader.
    const unit = event.deltaMode === 1 ? parseFloat(getComputedStyle(tooltip).lineHeight)
      : event.deltaMode === 2 ? tooltip.clientHeight : 1;
    event.preventDefault();
    hoveringTooltip = true;
    cancelHide();
    tooltip.scrollTop += event.deltaY * unit;
  }, {passive: false});
  addEventListener("keydown", event => { if (event.key === "Escape") close(); });
  addEventListener("click", event => { if (!tooltip.contains(event.target)) close(); });
  addEventListener("resize", close);
  addEventListener("scroll", () => {
    if (pinned || hoveringTooltip || tooltip.matches(":focus-within")) return;
    if (active && active.matches(":hover")) show(active, activeRegion);
    else close();
  }, {passive: true});
  return {close, mount};
})();
</script>
<script>
  "use strict";
  const slides = JSON.parse(document.getElementById("document-data").textContent);
  const stage = document.getElementById("stage");
  const previous = document.getElementById("previous"), next = document.getElementById("next");
  let index = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  function resize() {
    const ratio = slides[index].width / slides[index].height;
    stage.style.width = Math.min(innerWidth - 32, (innerHeight - 90) * ratio) + "px";
    stage.style.aspectRatio = String(ratio);
  }
  function render() {
    leanTooltips.close();
    const slide = slides[index];
    leanTooltips.mount(stage, slide);
    document.getElementById("counter").textContent = `${index + 1} / ${slides.length}`;
    previous.disabled = index === 0;
    next.disabled = index === slides.length - 1;
    history.replaceState(null, "", "#" + (index + 1));
    resize();
  }
  function move(delta) { index = Math.max(0, Math.min(slides.length - 1, index + delta)); render(); }
  previous.addEventListener("click", () => move(-1));
  next.addEventListener("click", () => move(1));
  document.getElementById("fullscreen").addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (_) { document.getElementById("hint").textContent = "Use your browser’s full-screen command."; }
  });
  addEventListener("keydown", event => {
    if (event.key === "Escape") leanTooltips.close();
    else if (!event.altKey && !event.ctrlKey && !event.metaKey) {
      if (["ArrowRight", "PageDown"].includes(event.key)) { event.preventDefault(); move(1); }
      if (["ArrowLeft", "PageUp"].includes(event.key)) { event.preventDefault(); move(-1); }
      if (event.key === "Home") { index = 0; render(); }
      if (event.key === "End") { index = slides.length - 1; render(); }
    }
  });
  addEventListener("resize", () => { leanTooltips.close(); resize(); });
  addEventListener("hashchange", () => { index = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1)); render(); });
  render();
</script>
