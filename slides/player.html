<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ — Lean slides</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #171b22; color: #eff3f8; font: 15px system-ui, sans-serif; }
  main { min-height: 100dvh; display: grid; place-content: center; gap: 16px; justify-items: center; }
  #stage { position: relative; background: white; box-shadow: 0 12px 60px #0006; }
  #stage > svg { display: block; width: 100%; height: 100%; }
  .hover { position: absolute; border: 0; padding: 0; margin: 0; background: transparent; color: transparent; cursor: help; }
  .hover:focus-visible, .hover.active { outline: 2px solid #60a5fa; border-radius: 3px; background: #60a5fa22; }
  .hover[data-role="state"] { cursor: pointer; }
  .hover[data-role="state"]:focus-visible, .hover[data-role="state"].active {
    outline: 1px solid #89949f; outline-offset: 2px; border-radius: 999px; background: transparent;
  }
  nav { display: flex; gap: 14px; align-items: center; }
  nav button { background: #303846; border: 1px solid #64748b; border-radius: 5px; color: inherit; padding: 6px 12px; cursor: pointer; }
  nav button:disabled { opacity: 0.35; cursor: default; }
  #hint { color: #bdc7d5; font-size: 12px; }
  #tooltip { position: fixed; z-index: 10; margin: 0; padding: 16px; max-width: min(650px, calc(100vw - 24px));
    max-height: min(65vh, 520px); overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
    background: #f8fafc; color: #1f2937; border: 1px solid #93a4ba; border-radius: 8px;
    box-shadow: 0 8px 32px #0006; font: 28px/1.5 "DejaVu Sans Mono", Menlo, monospace; }
  #tooltip[hidden] { display: none; }
  @media (max-width: 600px) { #hint { display: none; } }
</style>
<main>
  <div id="stage" role="region" aria-label="Presentation slide"></div>
  <nav aria-label="Slide navigation">
    <button id="previous" aria-label="Previous slide">←</button>
    <span id="counter" aria-live="polite"></span>
    <button id="next" aria-label="Next slide">→</button>
    <button id="fullscreen">Full screen</button>
    <span id="hint">Hover for Lean info · click to pin · Esc to close</span>
  </nav>
</main>
<pre id="tooltip" role="tooltip" hidden></pre>
<script type="application/json" id="slide-data">__SLIDE_DATA__</script>
<script>
  "use strict";
  const slides = JSON.parse(document.getElementById("slide-data").textContent);
  const stage = document.getElementById("stage");
  const tooltip = document.getElementById("tooltip");
  const previous = document.getElementById("previous"), next = document.getElementById("next");
  let index = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  let pinned = false, active = null;
  function close() {
    pinned = false;
    tooltip.hidden = true;
    if (active) { active.classList.remove("active"); active.removeAttribute("aria-describedby"); }
    active = null;
  }
  function show(button, region) {
    if (pinned) return;
    close();
    active = button;
    button.classList.add("active");
    button.setAttribute("aria-describedby", "tooltip");
    tooltip.textContent = region.tooltip;
    tooltip.hidden = false;
    const rect = button.getBoundingClientRect();
    const width = tooltip.offsetWidth, height = tooltip.offsetHeight;
    tooltip.style.left = Math.max(12, Math.min(rect.left, innerWidth - width - 12)) + "px";
    const below = rect.bottom + 10;
    tooltip.style.top = Math.max(12, below + height < innerHeight - 12 ? below : rect.top - height - 10) + "px";
  }
  function resize() {
    const ratio = slides[index].width / slides[index].height;
    stage.style.width = Math.min(innerWidth - 32, (innerHeight - 90) * ratio) + "px";
    stage.style.aspectRatio = String(ratio);
  }
  function render() {
    close();
    const slide = slides[index];
    stage.innerHTML = slide.svg;
    for (const region of slide.regions) {
      const button = document.createElement("button");
      button.className = "hover";
      button.dataset.role = region.role;
      button.setAttribute("aria-label", region.role === "state" ? "Proof state: " + region.tooltip : region.tooltip);
      button.style.left = (100 * region.x / slide.width) + "%";
      button.style.top = (100 * region.y / slide.height) + "%";
      button.style.width = (100 * region.width / slide.width) + "%";
      button.style.height = (100 * region.height / slide.height) + "%";
      button.addEventListener("pointerenter", () => show(button, region));
      button.addEventListener("pointerleave", () => { if (!pinned) close(); });
      button.addEventListener("focus", () => show(button, region));
      button.addEventListener("blur", () => { if (!pinned) close(); });
      button.addEventListener("click", event => {
        event.stopPropagation();
        if (pinned && active === button) { close(); return; }
        close(); show(button, region); pinned = true;
      });
      stage.append(button);
    }
    document.getElementById("counter").textContent = `${index + 1} / ${slides.length}`;
    previous.disabled = index === 0;
    next.disabled = index === slides.length - 1;
    history.replaceState(null, "", "#" + (index + 1));
    resize();
  }
  function move(delta) { index = Math.max(0, Math.min(slides.length - 1, index + delta)); render(); }
  previous.addEventListener("click", () => move(-1));
  next.addEventListener("click", () => move(1));
  document.getElementById("fullscreen").addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (_) { document.getElementById("hint").textContent = "Use your browser’s full-screen command."; }
  });
  addEventListener("keydown", event => {
    if (event.key === "Escape") close();
    else if (!event.altKey && !event.ctrlKey && !event.metaKey) {
      if (["ArrowRight", "PageDown"].includes(event.key)) { event.preventDefault(); move(1); }
      if (["ArrowLeft", "PageUp"].includes(event.key)) { event.preventDefault(); move(-1); }
      if (event.key === "Home") { index = 0; render(); }
      if (event.key === "End") { index = slides.length - 1; render(); }
    }
  });
  addEventListener("resize", () => { close(); resize(); });
  addEventListener("click", event => { if (!tooltip.contains(event.target)) close(); });
  addEventListener("hashchange", () => { index = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1)); render(); });
  render();
</script>
</html>
